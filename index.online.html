/* 一键填充中国公共假期: 2026 为国办官方安排, 2027 按新办法推算; 与已有假期重叠的自动跳过 */
/* 合并 holiday-cn 的逐日数据为连续区间(同名相邻日合并) */
function mergeHolidayDays(days){
  const off=(days||[]).filter(d=>d&&d.isOffDay&&d.date).map(d=>({name:String(d.name||"假期").replace(/\(推算.*/,""),date:d.date}))
    .sort((a,b)=>a.date<b.date?-1:1);
  const out=[];
  for(const d of off){
    const last=out[out.length-1];
    const nxt=last?fmtD(new Date(new Date(last.end+"T00:00:00").getTime()+864e5)):null;
    if(last&&last.name===d.name&&last.end===nxt) last.end=d.date;
    else out.push({name:d.name,start:d.date,end:d.date});
  }
  return out;
}
/* 假期自动获取: 当前年→考试年逐年在线拉取(holiday-cn 数据, jsDelivr 双源), 失败回退内置表;
   已过滤过去的假期; 有缓存/已覆盖的年份不重复请求 */
Plan.autoHolidays=async function(){
  ST.holidays=ST.holidays||[]; ST.holidayCache=ST.holidayCache||{};
  const today0=today();
  // 清理已结束的自动假期(手动添加的无 name 标记, 保留)
  ST.holidays=ST.holidays.filter(h=>!(h.name&&h.end<today0));
  const y0=new Date().getFullYear();
  const y1=ST.settings.examDate?Math.max(y0,new Date(ST.settings.examDate+"T00:00:00").getFullYear()):y0+1;
  let fetched=0; const failed=[];
  for(let y=y0;y<=y1;y++){
    if(ST.holidays.some(h=>h.start<=y+"-12-31"&&h.end>=y+"-01-01")) continue;   // 该年已覆盖
    let ranges=ST.holidayCache[y]||null;
    if(!ranges){
      for(const src of ["https://cdn.jsdelivr.net/gh/NateScarlett/holiday-cn@master/"+y+".json",
                        "https://fastly.jsdelivr.net/gh/NateScarlett/holiday-cn@master/"+y+".json"]){
        try{
          const r=await fetch(src,{cache:"no-store"}); if(!r.ok) throw new Error(r.status);
          ranges=mergeHolidayDays((await r.json()).days);
          ST.holidayCache[y]=ranges; fetched++;
          break;
        }catch(e){ /* 换下一个源 */ }
      }
      if(!ranges){   // 在线失败 → 内置表兜底
        const blt=CN_HOLIDAYS.filter(h=>h.s.startsWith(String(y))).map(h=>({name:h.n,start:h.s,end:h.e}));
        if(blt.length) ranges=blt; else failed.push(y);
      }
    }
    for(const rg of (ranges||[])){
      if(rg.end<today0) continue;                                                 // 已过去不添加
      if(ST.holidays.some(x=>x.start<=rg.end&&x.end>=rg.start)) continue;         // 区间去重
      ST.holidays.push({start:rg.start,end:rg.end,intensity:0.4,name:rg.name});
    }
  }
  ST.holidays.sort((a,b)=>a.start<b.start?-1:1);
  Store.save("holidays"); Store.save("holidayCache"); this.renderHolidays();
  if(failed.length) toast("已尽力填充; "+failed.join("/")+" 年暂无官方数据, 官方公布后再点一次即可");
  else toast(fetched?("已自动获取 "+fetched+" 年公共假期 (已过滤已过日期)"):"公共假期已是最新, 无需更新");
};

  if(!s||!e){ toast("请填写假期起止日期"); return; }
  if(s>e){ toast("起始日期不能晚于结束日期"); return; }
  ST.holidays=ST.holidays||[];
  ST.holidays.push({start:s,end:e,intensity:int}); ST.holidays.sort((a,b)=>a.start<b.start?-1:1);
  Store.save("holidays"); this.renderHolidays(); vPlan===undefined?0:0;
  toast("已添加假期 "+s+"~"+e);
};
Plan.delHoliday=function(i){ ST.holidays.splice(i,1); Store.save("holidays"); this.renderHolidays(); };

    <div class="muted" style="font-size:11px;margin-top:6px">键盘: <b>A/B/C/D</b> 选答案 · <b>Enter</b> 保存并下一题 · <b>S</b> 跳过 · <b>←/→</b> 前后翻</div></div>

Proof.rebuild=function(){
  const f=this.f;
  let qs;
  if(f.kind==="done") qs=allQ().filter(q=>ST.overrides[q.id]&&ST.overrides[q.id].needsReview===false);
  else{
    qs=allQ().filter(q=>q.needsReview);
    if(f.kind==="mismatch") qs=qs.filter(q=>q.answer.mismatch);
    else if(f.kind==="noans") qs=qs.filter(q=>!q.answer.resolved);
    else if(f.kind==="incomplete") qs=qs.filter(q=>q.incomplete);
  }
  if(f.book) qs=qs.filter(q=>q.chapterId.startsWith(f.book));
  if(f.ch) qs=qs.filter(q=>q.chapterId===f.ch||q.chapterId.startsWith(f.ch+"-"));
  qs.sort((a,b)=>((b.answer.mismatch?1:0)-(a.answer.mismatch?1:0))||((a.answer.resolved?1:0)-(b.answer.resolved?1:0))||((b.incomplete?1:0)-(a.incomplete?1:0)));
  this.queue=qs; this.pos=0;
  const all=allQ();
  const todo=all.filter(q=>q.needsReview).length;
  const mm=all.filter(q=>q.answer.mismatch).length;
  const na=all.filter(q=>!q.answer.resolved).length;
  const ic=all.filter(q=>q.incomplete).length;
  const dn=all.filter(q=>ST.overrides[q.id]&&ST.overrides[q.id].needsReview===false).length;
  const head=$("#pf-head"); if(head) head.textContent=`待校对 ${todo} · 答案冲突 ${mm} · 缺答案 ${na} · 不完整 ${ic} · 已校对 ${dn}`;
  const st=$("#pf-stat"); if(st) st.textContent=`当前筛选 ${qs.length} 题`;
  this.draw();
};
Proof.nav=function(d){ this.pos=Math.max(0,Math.min(this.queue.length-1,this.pos+d)); this.draw(); };
Proof.ignore=function(){   // 标记无需校对但不改答案
  const q=this.queue[this.pos]; if(!q) return;
  const ov=ST.overrides[q.id]||{}; ov.needsReview=false;
  ST.overrides[q.id]=ov; Store.save("overrides");
  this.pos++; this.draw(); toast("已标记为无需校对");
};
Proof.batchAsk=async function(){
  const all=allQ().filter(q=>q.answer.mismatch);
  if(!all.length){ toast("当前没有答案冲突题"); return; }
  const src=await ask(`共 <b>${all.length}</b> 道题「答案键」与「解析推得」不一致。<br>选择批量采纳的依据：`,
    [{label:"采纳 答案键 (fromKey)",val:"fromKey"},{label:"采纳 解析推得 (fromAnalysis)",val:"fromAnalysis"},{label:"取消",val:"",cls:"ghost"}]);
  if(!src) return;
  let n=0;
  for(const q of all){ const v=q.answer[src]; if(!v) continue;
    const ov=ST.overrides[q.id]||{};
    ov.answer=Object.assign({},ov.answer,{resolved:v,mismatch:false});
    ov.needsReview=false; ST.overrides[q.id]=ov; n++; }
  Store.save("overrides");
  toast(n?`已批量采纳 ${n} 题（依据 ${src==="fromKey"?"答案键":"解析推得"}）；未取到值的不处理`:"没有可取值的冲突题");
  this.rebuild();
};
function wireProofKeys(){
  if(Proof._kh) document.removeEventListener("keydown",Proof._kh);
  Proof._kh=e=>{
    if(location.hash!=="#proof") return;
    const t=(e.target&&e.target.tagName)||"";
    if(t==="TEXTAREA"||t==="INPUT"||t==="SELECT") return;
    const k=String(e.key||"").toUpperCase();
    if(k.length===1&&"ABCD".includes(k)){ const s=$("#pf-ans"); if(s) s.value=k; e.preventDefault(); return; }
    if(e.key==="Enter"){ e.preventDefault(); Proof.save(true); }
    else if(k==="S"){ Proof.save(false); }
    else if(e.key==="ArrowRight"){ Proof.nav(1); }
    else if(e.key==="ArrowLeft"){ Proof.nav(-1); }
  };
  document.addEventListener("keydown",Proof._kh);
}

  area.innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between"><div>
      ${q.answer.mismatch?'<span class="tag bad">⚠ 答案冲突</span>':""}
      ${!q.answer.resolved?'<span class="tag warn">缺答案</span>':""}
      ${q.incomplete?'<span class="tag bad">不完整(缺题干/选项)</span>':""}
      <span class="muted">${q.id} · ${esc(chapPath(q.chapterId))} · p${q.sourcePage||"?"}</span></div>
      <span class="muted">#${Proof.pos+1}/${Proof.queue.length}</span></div>
    <div class="row" style="align-items:flex-start;margin-top:10px">
      <div style="flex:1;min-width:300px">${(q.media||[]).map(m=>`<img class="media-img" src="${mediaSrc(m)}" onerror="this.outerHTML='<span class=muted>原图缺失(${esc(m.src)})</span>'">`).join("")||'<span class="muted">无原图</span>'}</div>
      <div class="grow">
        <label class="muted">渲染预览（实际显示效果）</label>
        <div style="border:1px solid rgba(128,128,128,.3);border-radius:8px;padding:8px 10px;margin:4px 0 8px;background:rgba(128,128,128,.05)">
          <div class="stem">${subT(q.stem)}</div>
          <div style="margin-top:6px">${q.options.map(o=>`<div style="margin:3px 0"><b>${o.key}.</b> ${subT(o.text)}</div>`).join("")}</div>
          <div style="margin-top:8px;border-top:1px dashed rgba(128,128,128,.3);padding-top:6px"><b class="muted">解析：</b>${q.analysis?subT(q.analysis):'<span class="muted">（无解析）</span>'}</div>
        </div>
        <div class="row" style="margin-top:6px">
          <label class="muted">答案</label>
          <select id="pf-ans">${["","A","B","C","D"].map(k=>`<option ${q.answer.resolved===k?"selected":""}>${k}</option>`).join("")}</select>
          <span class="muted">答案键:${q.answer.fromKey||"-"} · 解析推得:${q.answer.fromAnalysis||"-"}</span></div>
        <details style="margin-top:6px"><summary class="muted" style="cursor:pointer">编辑原文（改完保存生效）</summary>
          <label class="muted">题干</label><textarea id="pf-stem" rows="3">${esc(q.stem)}</textarea>
          <label class="muted">选项 (每行 A|文本)</label><textarea id="pf-opts" rows="4">${esc(q.options.map(o=>o.key+"|"+o.text).join("\n"))}</textarea>
          <label class="muted" style="margin-top:6px">解析</label><textarea id="pf-ana" rows="3">${esc(q.analysis)}</textarea>
        </details>
        <div class="row" style="margin-top:8px">
          <button class="btn ok" onclick="Proof.save(true)">保存并下一题</button>
          <button class="btn gray" onclick="Proof.save(false)">跳过</button>
          <button class="btn ghost sm" onclick="Proof.ignore()">标记无需校对</button>
          <button class="btn ghost sm" onclick="Proof.nav(-1)">← 上一题</button></div>
      </div></div></div>`;
  renderMath(area);
};
Proof.save=function(apply){
  if(apply){
    const q=Proof.queue[Proof.pos];
    const ov={stem:$("#pf-stem").value.trim(),
      options:$("#pf-opts").value.split("\n").filter(x=>x.includes("|")).map(l=>{const i=l.indexOf("|");return{key:l.slice(0,i).trim().toUpperCase(),text:l.slice(i+1).trim()};}),
      analysis:$("#pf-ana").value.trim(),needsReview:false,
      answer:{resolved:$("#pf-ans").value,mismatch:false}};
    ST.overrides[q.id]=ov; Store.save("overrides");
  }
  Proof.pos++; Proof.draw();
};
Proof.exportPatch=function(){
  const bank=JSON.parse(JSON.stringify(BANK));
  for(const q of bank.questions){ const ov=ST.overrides[q.id]; if(ov) Object.assign(q,ov,{answer:{...q.answer,...(ov.answer||{})}}); }
  download("question-bank-patched.json",JSON.stringify(bank,null,1),"application/json");
};

/* ================= 统计 ================= */
function vStats(){
  const qs=allQ(); const done=qs.filter(q=>prog(q.id).a>0);
  const okc=done.filter(q=>prog(q.id).c>prog(q.id).w).length;
  // 掌握度分层: 未刷 / 生疏(错≥对) / 熟悉(对>错) / 掌握(全对≥2次 或 手动标记掌握)
  const lv={none:0,weak:0,fam:0,mst:0};
  for(const q of qs){ const p=prog(q.id);
    if(!p.a){ lv.none++; continue; }
    if(p.mastered||(p.c>p.w&&p.w===0&&p.c>=2)) lv.mst++;
    else if(p.c>p.w) lv.fam++;
    else lv.weak++; }
  const accAll=done.length?Math.round(okc/done.length*100):0;
  // 章节统计(带 cid, 供薄弱章节排行与一键组卷)
  const chStat=Object.entries(IDX.ch).map(([cid,c])=>{
    const cq=qs.filter(q=>q.chapterId===cid||q.chapterId.startsWith(cid+"-"));
    const dn=cq.filter(q=>prog(q.id).a>0);
    const ok=dn.filter(q=>prog(q.id).c>prog(q.id).w).length;
    return {cid,title:c.title,n:cq.length,d:dn.length,ok,acc:dn.length?Math.round(ok/dn.length*100):null};
  });
  const weak=chStat.filter(r=>r.d>=3&&r.acc!==null).sort((a,b)=>a.acc-b.acc).slice(0,10);
  // 按资料(书)统计 —— 书名取真实导入文件名
  const bmap={};
  for(const q of qs){ const m=bookOfCh(q.chapterId); const t=m?m.title:"未归类";
    const b=bmap[t]||(bmap[t]={n:0,d:0,ok:0}); b.n++; const p=prog(q.id);
    if(p.a){ b.d++; if(p.c>p.w) b.ok++; } }
  const brows=Object.entries(bmap).sort((a,b)=>b[1].n-a[1].n);
  // 模考目标(默认 70%)
  const tgt=+ST.settings.targetAcc||0;
  const lastEx=ST.exams[0]||null;
  // 近7天
  const days=[]; for(let i=6;i>=0;i--){ const dt=fmtD(new Date(Date.now()-i*864e5));
    days.push([dt.slice(5),ST.daily[dt]||{b:0,ok:0,cards:0}]); }
  const maxB=Math.max(1,...days.map(d=>d[1].b));
  // 24h 时段分布(自记录起, 旧数据无 h 字段按 0 计)
  const hours=Array(24).fill(0);
  for(const v of Object.values(ST.daily)){ const h=v.h||[]; for(let i=0;i<24;i++) hours[i]+=h[i]||0; }
  const maxH=Math.max(1,...hours);
  // 半年活跃热力(近26周, 档位按每日目标题数)
  const target=+ST.settings.dailyBrush||50;
  const pad2=n=>String(n).padStart(2,"0");
  const fmtDay=dt=>dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate());
  const endD=new Date(); endD.setHours(0,0,0,0);
  const startD0=new Date(endD.getTime()-181*864e5); const startD=new Date(startD0.getTime()-((startD0.getDay()+6)%7)*864e5);
  const heat=[];
  for(let dt=new Date(startD); dt<=endD; dt=new Date(dt.getTime()+864e5)){
    const k=fmtDay(dt); const b=(ST.daily[k]||{}).b||0;
    const lv=b===0?0:b<target*0.34?1:b<target*0.67?2:b<target?3:4;
    const st=lv===0?"background:rgba(128,128,128,.18)":`background:var(--pri);opacity:${[0.3,0.55,0.8,1][lv-1]}`;
    heat.push(`<i title="${k} · ${b}题" style="width:11px;height:11px;border-radius:2px;${st}"></i>`);
  }
  // 章节 × 正确率 —— 按考纲科目合并(同科目跨多份资料/多本书合计为一行), 未映射科目的章节按原章节名归组
  const rowsM={};
  for(const r of chStat){ if(!r.n) continue;
    const sj=Plan.subjOfCh(r.cid); const t=sj?sj.title:r.title;
    const g=rowsM[t]||(rowsM[t]={t,n:0,d:0,ok:0});
    g.n+=r.n; g.d+=r.d; g.ok+=r.ok||0; }
  const rows=Object.values(rowsM).filter(r=>r.d>0).map(r=>[r.t,r.n,r.d,Math.round(r.ok/r.d*100)]);
  const LV=[["掌握","var(--ok-bg)","#2e7d32",lv.mst],["熟悉","var(--warn-bg)","#a8801a",lv.fam],
    ["生疏","var(--bad-bg)","#c0392b",lv.weak],["未刷","rgba(128,128,128,.18)","#777",lv.none]];
  const lvTot=Math.max(1,lv.mst+lv.fam+lv.weak+lv.none);
  // 正确率趋势(近30天) / 按科目正确率 / 模考 vs 目标差距 —— 图表数据
  const _tN=30,_tW=600,_tH=160,_tPL=34,_tPR=12,_tPT=14,_tPB=22;
  const _td=[]; for(let i=_tN-1;i>=0;i--){ const dt=fmtD(new Date(Date.now()-i*864e5));
    const v=ST.daily[dt]; _td.push({dt,acc:(v&&v.b)?v.ok/v.b*100:null,b:v?v.b:0}); }
  const _X=i=>_tPL+(_tW-_tPL-_tPR)*i/(_tN-1);
  const _Y=a=>_tPT+(_tH-_tPT-_tPB)*(1-a/100);
  const _av=_td.filter(d=>d.acc!==null);
  const _poly=_av.length?("M"+_av.map(d=>{const idx=_td.indexOf(d);return _X(idx).toFixed(1)+" "+_Y(d.acc).toFixed(1);}).join(" L")):"";
  const _dots=_av.map(d=>{const idx=_td.indexOf(d);return `<circle cx="${_X(idx).toFixed(1)}" cy="${_Y(d.acc).toFixed(1)}" r="2.4" fill="var(--pri)"/>`;}).join("");
  const _tgrid=[0,50,100].map(g=>`<line x1="${_tPL}" y1="${_Y(g)}" x2="${_tW-_tPR}" y2="${_Y(g)}" stroke="rgba(128,128,128,.2)"/><text x="${_tPL-4}" y="${(_Y(g)+3)}" text-anchor="end" font-size="9" fill="#888">${g}</text>`).join("");
  const _tline=tgt?`<line x1="${_tPL}" y1="${_Y(tgt)}" x2="${_tW-_tPR}" y2="${_Y(tgt)}" stroke="#c0392b" stroke-dasharray="4 3"/><text x="${_tW-_tPR}" y="${(_Y(tgt)-3).toFixed(1)}" text-anchor="end" font-size="10" fill="#c0392b">目标 ${tgt}%</text>`:"";
  const _trendSVG=`<svg viewBox="0 0 ${_tW} ${_tH}" style="width:100%;max-width:600px;height:auto;color:var(--fg)">${_tgrid}<path d="${_poly}" fill="none" stroke="var(--pri)" stroke-width="2"/>${_dots}${_tline}<text x="${_tPL}" y="${_tH-6}" font-size="9" fill="#888">${_td[0].dt.slice(5)}</text><text x="${_tW-_tPR}" y="${_tH-6}" text-anchor="end" font-size="9" fill="#888">${_td[_tN-1].dt.slice(5)}</text></svg>`;
  // 按考纲科目统计正确率(科目 = 考纲17科, 题库章节已映射到科目; 资料/书维度见下方「按资料统计」)
  const _sbArr=Plan.subjects().filter(s=>s.qTotal>0)

    .sort((a,b)=>a.acc-b.acc);
  const _sbH=Math.max(40,_sbArr.length*22);
  const _sbSVG=`<svg viewBox="0 0 620 ${_sbH}" style="width:100%;max-width:620px;height:auto;color:var(--fg)">${_sbArr.map((s,i)=>{const col=s.acc>=70?"var(--ok)":s.acc>=40?"var(--warn)":"var(--bad)";
    return `<g transform="translate(0,${i*22})"><text x="0" y="14" font-size="11" fill="currentColor">${esc(s.t.slice(0,15))}</text>
      <rect x="170" y="2" width="380" height="15" rx="3" fill="rgba(128,128,128,.15)"/>
      <rect x="170" y="2" width="${Math.max(2,380*s.acc/100)}" height="15" rx="3" fill="${col}"/>
      <text x="560" y="14" font-size="10" fill="#555" text-anchor="end">${s.acc?Math.round(s.acc)+"%":"—"} (${s.d}/${s.n})</text></g>`;}).join("")}</svg>`;
  const _exs=ST.exams.slice(0,12), _exN=_exs.length;
  const _avg=_exN?Math.round(_exs.reduce((s,e)=>s+e.acc,0)/_exN):0;
  const _exBW=520,_exBH=16,_exGap=8,_exCH=Math.max(20,_exN*(_exBH+_exGap));
  const _exSVG=`<svg viewBox="0 0 ${_exBW+70} ${_exCH}" style="width:100%;max-width:600px;height:auto;color:var(--fg)">
    ${tgt?`<line x1="${44+(_exBW-44)*tgt/100}" y1="0" x2="${44+(_exBW-44)*tgt/100}" y2="${_exCH}" stroke="#c0392b" stroke-dasharray="4 3"/>`:""}
    ${_exs.map((e,i)=>{const yy=i*(_exBH+_exGap); const col=e.acc>=tgt?"var(--pri)":"#c0392b"; const w=44+(_exBW-44)*e.acc/100;
      return `<g transform="translate(0,${yy})"><text x="0" y="${_exBH-3}" font-size="9" fill="currentColor">${e.date.slice(5)}</text>
      <rect x="44" y="0" width="${_exBW-44}" height="${_exBH}" rx="3" fill="rgba(128,128,128,.15)"/>
      <rect x="44" y="0" width="${Math.max(2,w-44)}" height="${_exBH}" rx="3" fill="${col}"/></g>`;}).join("")}</svg>`;
  $("#main").innerHTML=`<h2>统计</h2>
  <div class="card"><div class="kv">
    <div class="item"><div class="muted">总题量</div><div class="num">${qs.length}</div></div>
    <div class="item"><div class="muted">已刷</div><div class="num">${done.length}</div></div>
    <div class="item"><div class="muted">总正确率</div><div class="num">${accAll}%</div></div>
    <div class="item"><div class="muted">模考次数</div><div class="num">${ST.exams.length}</div></div></div>
    <div style="margin-top:12px"><div class="muted" style="font-size:12px;margin-bottom:4px">掌握度分布

const Stat={
  setTarget(v){ ST.settings.targetAcc=Math.max(0,Math.min(100,+v||0)); Store.save("settings"); vStats(); },
  // 薄弱章节 → 组卷: 预填自定义卷(该章 + 优先错题), 跳到模拟考试页
  paper(cid){
    const books=Object.fromEntries(bookMetaAll().map(b=>[b.tag,true]));
    const m=bookOfCh(cid); if(m) Object.keys(books).forEach(k=>{ books[k]=(k===m.tag); });
    const pool=Exam.qPoolCount(m?[m.tag]:Object.keys(books),[cid]);
    if(!pool){ toast("该章节暂无可抽题目"); return; }
    const types=[...new Set(allQ().filter(q=>q.chapterId===cid||q.chapterId.startsWith(cid+"-")).map(q=>q.type).filter(Boolean))];
    Exam.custom={name:"薄弱章攻坚 · "+(IDX.ch[cid]||{}).title,duration:30,books,chapters:[cid],
      sections:[{type:types.includes("single_choice")?"single_choice":(types[0]||"single_choice"),
        count:Math.min(10,pool),scorePerQuestion:1,preferWrong:true}]};
    location.hash="#exam"; toast("已预填该章组卷, 可直接开考");
  },
  // 薄弱章节 → 直接刷题
  brush(cid){
    Brush.f={book:(bookOfCh(cid)||{}).tag||"",ch:cid,mode:"seq",scope:"all",n:50};
    buildQueue(); location.hash="#brush";
    toast(Brush.queue.length?("已排入 "+Brush.queue.length+" 题"):"该章节暂无题目");
  }
};

const SUPABASE_SCHEMA_SQL=`create table if not exists beikao_state (
  id          text primary key,
  data        jsonb not null default '{}'::jsonb,
  updated_at  timestamptz default now()
);
alter table beikao_state enable row level security;
create policy "anon_beikao_rw" on beikao_state for all to anon using (true) with check (true);`;
const Settings={
  backupHint(){
    const lb=ST.settings.lastBackup;
    const imps=Imports.all().length;
    if(!lb) return `尚未备份过${imps?"（当前有 "+imps+" 份导入题库，建议用「完整备份」导出，否则换设备/清缓存后需重新导入）":""}。`;
    const days=Math.round((Date.now()-new Date(lb+"T00:00:00").getTime())/864e5);
    return `上次备份：${lb}（${days} 天前）${days>=7?' · <b style="color:#c0392b">建议重新备份</b>':""}${imps?" · 含 "+imps+" 份导入题库":""}`;
  },
  save(){ ST.settings.theme=$("#set-theme").value;
    ST.settings.supabaseUrl=$("#set-sburl").value.trim();
    ST.settings.supabaseKey=$("#set-sbkey").value.trim();
    ST.settings.ai={url:$("#set-aiurl").value.trim(),key:$("#set-aikey").value.trim(),model:$("#set-aimodel").value.trim()||"deepseek-chat"};
    Store.save("settings"); document.body.dataset.theme=ST.settings.theme; toast("已保存"); },
  copySchema(){ const s=SUPABASE_SCHEMA_SQL; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(()=>toast("建表 SQL 已复制，去 Supabase SQL 编辑器粘贴执行")).catch(()=>toast("复制失败，请手动选择下方 SQL")); } else { toast("当前环境不支持剪贴板，请手动复制"); } },
  async checkSupabase(){
    if(!ST.settings.supabaseUrl||!ST.settings.supabaseKey){ toast("请先填 URL 和 anon key"); return; }
    try{
      const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      const sb=createClient(ST.settings.supabaseUrl,ST.settings.supabaseKey);
      const {data,error}=await sb.from("beikao_state").select("id").limit(1);
      if(error){ if(/does not exist|relation/i.test(error.message)) toast("⚠ 表不存在：请先「复制建表 SQL」并在 Supabase 执行"); else toast("连接异常: "+error.message); }
      else toast("✓ 连接正常，beikao_state 表已就绪");
    }catch(e){ toast("检查失败: "+e.message); }
  },
  async sync(push){
    if(!ST.settings.supabaseUrl||!ST.settings.supabaseKey){ toast("请先填 Supabase URL 和 anon key"); return; }
    try{
      const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      const sb=createClient(ST.settings.supabaseUrl,ST.settings.supabaseKey);
      if(push){
        const data=Sync.pushPayload();
        const {error}=await sb.from("beikao_state").upsert({id:"local",data,updated_at:new Date().toISOString()});
        if(error) throw error; toast("已增量同步(含导入题库)到云端");
      }else{
        const {data,error}=await sb.from("beikao_state").select("data").eq("id","local").single();
        if(error) throw error;
        const payload=(data&&data.data)?data.data:data;
        Sync.pull(payload);
        await Store.saveAll(); toast("已从云端合并到本机(增量, 不覆盖本地进度)"); location.reload();
      }
    }catch(e){ toast("同步失败: "+e.message); }
  },
  /* 备份格式 v2: {app, v, date, data:{...SKEYS}, imports:[...]}
     - 进度备份: 体积小(通常 <1MB); 完整备份额外带上导入的题库 JSON(可能几十 MB) */
  exportAll(withImports){
    const out={app:"beikao",v:2,date:new Date().toISOString(),data:{}};
    SKEYS.forEach(k=>out.data[k]=ST[k]);
    if(withImports) out.imports=Imports.all();
    const txt=JSON.stringify(out);
    download("beikao-backup-"+today().replace(/-/g,"")+(withImports?"-full":"")+".json",txt,"application/json");
    ST.settings.lastBackup=today(); Store.save("settings");
    toast("已导出 "+(txt.length/1048576).toFixed(2)+"MB"+(withImports?"（含 "+out.imports.length+" 份导入资料）":""));
    if(location.hash==="#set") vSet();
  },
  exportMD(){
    const kps=BANK.knowledgePoints||[]; const chs=BANK.chapters||[];
    const chTitle={}; chs.forEach(c=>chTitle[c.id]=c.title);
    const byCh={}; kps.forEach(k=>{(byCh[k.chapterId]=byCh[k.chapterId]||[]).push(k);});
    const seen=new Set(); const order=[]; kps.forEach(k=>{ if(!seen.has(k.chapterId)){seen.add(k.chapterId);order.push(k.chapterId);} });
    const L=["# 备考工作台 · 知识点笔记",""];
    for(const cid of order){
      L.push("## "+(chTitle[cid]||cid));
      (byCh[cid]||[]).forEach(k=>{
        L.push("### "+(k.title||k.id));
        if(k.content) L.push(k.content.replace(/\n{2,}/g,"\n\n").trim());
        if(k.tags&&k.tags.length) L.push("\n标签: "+k.tags.map(t=>"`"+t+"`").join(", "));
        L.push("");
      });
    }
    const md=L.join("\n");
    download("beikao-notes-"+today().replace(/-/g,"")+".md", md, "text/markdown");
    toast("已导出 Markdown 笔记（"+kps.length+" 个知识点）");
  },
  exportAnki(){
    const qs=allQ().filter(q=>q.stem&&q.options&&q.options.length&&q.answer&&q.answer.resolved);
    if(!qs.length){ toast("暂无可导出题目（需先有已确认答案的题）"); return; }
    const field=s=>esc((s||"").replace(/\n+/g,"<br>")).replace(/\t/g," ");
    const rows=qs.map(q=>{
      const front=field(q.stem)+"<br>"+(q.options||[]).map(x=>x.key+". "+field(x.text)).join("<br>");
      const back="答案："+field(q.answer.resolved)+(q.analysis?("<br>解析："+field(q.analysis)):"");
      return front+"\t"+back;
    });
    const tsv=rows.join("\n");
    download("beikao-anki-"+today().replace(/-/g,"")+".txt", tsv, "text/tab-separated-values");
    toast("已导出 Anki 卡片（"+qs.length+" 张）· 导入时字段分隔符选 Tab，勾选允许 HTML");
  },
  printWrong(){
    const wrong=allQ().filter(q=>{const p=prog(q.id);return p.a>0&&p.w>0;});
    if(!wrong.length){ toast("错题本为空"); return; }
    const card=q=>{
      const o=(q.options||[]).map(x=>'<div class="opt">'+x.key+'. '+esc(x.text)+'</div>').join('');
      return '<div class="q"><div class="stem">'+esc(q.stem)+'</div>'+o+
        '<div class="ans">答案：'+esc(q.answer.resolved)+'</div>'+
        '<div class="ana">解析：'+esc(q.analysis||'')+'</div></div>';
    };
    const html='<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>错题本</title>'+
      '<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;padding:24px;color:#222}'+
      'h1{font-size:18px} .q{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0;page-break-inside:avoid}'+
      '.stem{font-weight:600;margin-bottom:6px} .opt{margin:2px 0} .ans{color:#c0392b;margin-top:6px}'+
      '.ana{color:#555;margin-top:4px;font-size:13px}</style></head><body>'+
      '<h1>备考工作台 · 错题本（'+wrong.length+' 题）</h1>'+wrong.map(card).join('')+'</body></html>';
    const w=window.open('','_blank');

    w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>{ try{w.print();}catch(e){} },350);
  },
  async importAll(inp){
    const f=inp.files&&inp.files[0]; if(!f) return; inp.value="";
    let d=null;
    try{ d=JSON.parse(await f.text()); }catch(e){ toast("文件解析失败"); return; }
    const body=(d&&d.data&&typeof d.data==="object")?d.data:d;      // 兼容旧版扁平格式
    const imps=Array.isArray(d&&d.imports)?d.imports:[];
    if(!SKEYS.some(k=>body[k]!==undefined)&&!imps.length){ toast("文件中没有可识别的备考数据"); return; }
    const mode=await ask(`导入 <b>${esc(f.name)}</b><br>
      进度：${Object.keys(body).filter(k=>SKEYS.includes(k)).join("/")||"无"}${imps.length?`<br>含导入题库 <b>${imps.length}</b> 份`:""}
      <br><br>选择导入方式：`,
      [{label:"合并（保留现有, 导入优先）",val:"merge"},{label:"全量覆盖（清空后写入）",val:"replace",cls:"bad"},{label:"取消",val:"",cls:"ghost"}]);
    if(!mode) return;
    if(mode==="replace") SKEYS.forEach(k=>{ const def=ST_DEF[k];
      ST[k]= (def===undefined) ? (k==="exams"||k==="videos"?[]:{}) : JSON.parse(JSON.stringify(def)); });
    SKEYS.forEach(k=>{ if(body[k]!==undefined) ST[k]=body[k]; });
    ST.settings=Object.assign({examDate:"",examName:"注册环保工程师·基础考试",dailyNew:20,dailyBrush:50,weekdayMin:90,weekendMin:240,subjects:{},theme:"light",srsMode:"sm2",targetAcc:70,targetScore:132,subjMigrated:false,learnRatio:{base:60,mid:40,sprint:15},supabaseUrl:"",supabaseKey:""},ST.settings);
    let addImp=0;
    if(imps.length){
      const cur=Imports.all(), names=new Set(cur.map(x=>x.name));
      imps.forEach(im=>{ if(im&&im.name&&!names.has(im.name)){ cur.push(im); names.add(im.name); addImp++; } });
      if(addImp) Imports._save(cur);
    }
    await Store.saveAll();
    toast("导入成功"+(addImp?(" · 恢复 "+addImp+" 份导入资料"):"")+", 正在重载…");
    setTimeout(()=>location.reload(),700);
  }
};

function vFish(){
  $("#side").style.display="none"; $("#main").style.marginLeft="0"; $("#main").style.padding="10px";
  Fish.next();
}
const Fish={
  next(){
    const due=dueCards();
    if(due.length){ this.card=due[0]; this.mode="card"; }
    else{
      const pool=allQ().filter(q=>q.stem&&q.options.length>=2&&!q.incomplete&&prog(q.id).a===0&&!q.duplicateOf);
      if(!pool.length){ $("#main").innerHTML='<div class="card">题库为空, 请先导入题库。</div>'; return; }
      this.q=pool[Math.floor(Math.random()*pool.length)]; this.mode="q"; this.picked=null;
    }
    this.draw();
  },
  draw(){
    const m=$("#main");
    if(this.mode==="card"){
      m.innerHTML=`<div class="card" onclick="Fish.flip()" style="cursor:pointer"><div class="muted">闪卡</div>
        <div style="margin-top:6px;line-height:1.6">${this.show?this.card.back:esc(this.card.front)}</div>
        <div class="muted" style="margin-top:8px">${this.show?"点击 = 认识, 进入下一张":"点击显示答案"}</div></div>`;
    }else{
      const q=this.q;
      m.innerHTML=`<div class="card"><div class="muted">${esc(chapPath(q.chapterId))}</div>
        <div style="margin:6px 0;line-height:1.6">${subT(q.stem)}</div>
        ${q.options.map(o=>`<div class="opt ${this.picked===o.key?"sel":""}" style="padding:6px 10px;margin:4px 0" onclick="Fish.pick('${o.key}')">${o.key}. ${subT(o.text)}</div>`).join("")}
        ${this.picked?`<div class="muted" style="margin-top:6px">答案: ${q.answer.resolved||"待校对"}</div>`:""}</div>
      <button class="btn sm gray" onclick="Fish.next()">下一题</button>`;
    }
    renderMath(m);
  },
  // 记录一张卡为"已认识"(SM-2 视为良好), 推进其复习计划, 避免今日重复
  _seen(c){ if(!c) return; const now=Date.now();
    let s=ST.srs[c.id]||{due:now,iv:0,ef:2.5,reps:0};
    s.reps++; s.iv=s.reps===1?1:Math.round(s.iv*s.ef); s.ef=Math.max(1.3,s.ef+0.1);
    s.due=now+s.iv*864e5; s.last=now; ST.srs[c.id]=s; Store.save("srs"); },
  flip(){ if(this.mode!=="card"){ this.next(); return; }
    if(!this.show){ this.show=true; this.draw(); }                 // 首次点击: 显示答案
    else { this._seen(this.card); this.show=false; this.next(); }  // 再次点击: 认识 -> 记录并下一张
  },
  pick(k){ this.picked=k; this.draw(); }
};

    if(!total){ box.textContent="该书无页数信息, 跳过自检"; return; }

    for(let p=1;p<=total;p++){ const im=new Image();

};

  const sj=v.chapterId?Plan.subjOfCh(v.chapterId):null;
  return sj?sj.title:(chapPath(v.chapterId)||"未分类"); };
/* 旧数据迁移: 只有 chapterId 的视频按章节映射补 subjectId */
Lib.migrateVidSubj=function(){
  let ch=false;
  (ST.videos||[]).forEach(v=>{ if(!v||v.subjectId) return;
    const sj=v.chapterId?Plan.subjOfCh(v.chapterId):null;
    if(sj){ v.subjectId=sj.id; ch=true; } });

Lib.toggleVidImport=function(){ const b=$("#vid-import-box"); if(b) b.style.display=b.style.display==="none"?"block":"none"; };
/* 按名称解析章节 id: 章节名互相包含时取更长的那个, 避免短名误匹配 */
Lib.resolveChap=function(name){
  const n=String(name||"").trim().toLowerCase(); if(n.length<2) return "";
  let best="",bl=0;
  for(const c of (BANK.chapters||[])){
    const t=String(c.title||"").trim().toLowerCase(); if(t.length<2) continue;
    if((n===t||n.indexOf(t)>=0||t.indexOf(n)>=0)&&t.length>bl){ best=c.id; bl=t.length; }
  }
  return best;
};
Lib._isUrl=function(p){ return /^(https?:\/\/|file:\/\/|blob:|\/|\.\/|\\\\|[a-z]:[\\/])/i.test(p)||/\.(mp4|m3u8|webm|mkv|mov|avi|flv|m4v|ts)$/i.test(p); };

Lib._parseVidRows=function(text){
  const lines=String(text||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean).filter(l=>!/^#/.test(l));
  const rows=[];
  for(const line of lines){
    let cells;
    if(line.indexOf("|")>=0||line.indexOf("\t")>=0) cells=line.split(/[|\t]+/);
    else if(line.indexOf("，")>=0) cells=line.split(/，+/);
    else { const cm=line.split(","); cells=cm.filter(Boolean).length<=3?cm:[line]; }
    cells=cells.map(s=>s.trim()).filter(Boolean);
    const ui=cells.findIndex(p=>this._isUrl(p));
    let url=ui>=0?cells[ui]:null;
    if(!url){ const m=line.match(/https?:\/\/[^\s"'<>]+/); url=m?m[1]:null; }
    if(!url) continue;
    const rest=cells.filter((p,i)=>i!==ui&&p!==url);
    rows.push({url,title:rest[0]||Lib._titleFromUrl(url),chap:rest[1]||""});
  }
  return rows;
};
Lib._titleFromUrl=function(url){
  try{
    const base=String(url).split(/[?#]/)[0].replace(/\\/g,"/");
    let n=decodeURIComponent(base.split("/").pop()||"").replace(/\.[a-z0-9]{2,5}$/i,"");
    return n.trim();
  }catch(e){ return ""; }
};

const Imports={
  all(){ try{ return JSON.parse(localStorage.getItem("bk-imports")||"[]"); }catch(e){ return []; } },
  _save(l){ try{ localStorage.setItem("bk-imports",JSON.stringify(l)); return true; }
    catch(e){ toast("保存失败: 导入内容过大, 浏览器本地空间不足"); return false; } },
  apply(){   // 启动时并入 BANK (id 加前缀防冲突), 之后 buildIndexes 全局生效
    // 合并策略: 含 knowledgePoints 的资料视为「知识点资料」——只并入章节+知识点, 不并入题目(含题干);
    // 纯题库(仅 questions)才并入题目。
    this.all().forEach((imp,ni)=>{
      let b; try{ b=JSON.parse(imp.json); }catch(e){ return; }
      const px="i"+ni+"_";
      (b.chapters||[]).forEach(c=>BANK.chapters.push(Object.assign({},c,{id:px+c.id,
        children:(c.children||[]).map(s=>Object.assign({},s,{id:px+s.id}))})));
      const kps=b.knowledgePoints||[];
      if(kps.length){
        kps.forEach(k=>BANK.knowledgePoints.push(Object.assign({},k,
          {id:px+k.id,chapterId:px+(k.chapterId||""),parentId:k.parentId?px+k.parentId:k.parentId})));
        return;   // 知识点资料: 题目一律不导入
      }
      (b.questions||[]).forEach(q=>BANK.questions.push(Object.assign({},q,{id:px+q.id,chapterId:px+(q.chapterId||"")})));
    });
  },
  addFiles(files){
    const list=this.all(); let added=0;
    const readNext=(arr,done)=>{ if(!arr.length){ done(); return; }
      const f=arr.shift(); const r=new FileReader();
      r.onload=()=>{ try{ const data=JSON.parse(r.result);
          const nq=(data.questions||[]).length, nk=(data.knowledgePoints||[]).length, nc=(data.chapters||[]).length;
          if(!nq&&!nk){ toast(f.name+" 中无 questions/knowledgePoints, 已跳过"); }
          else { list.push({name:f.name,date:fmtD(new Date()),
              kind:nk?"kp":"q",nc,nq,nk,json:r.result}); added++; }
        }catch(e){ toast(f.name+" 解析失败, 已跳过"); }
        readNext(arr,done); };
      r.onerror=()=>{ toast(f.name+" 读取失败"); readNext(arr,done); };
      r.readAsText(f); };
    readNext([...files],()=>{ if(added&&this._save(list)){ toast("已导入 "+added+" 份资料, 正在合并…"); setTimeout(()=>location.reload(),600); } });
  },
  del(i){ const l=this.all(); l.splice(i,1);
    if(this._save(l)){ toast("已删除"); setTimeout(()=>location.reload(),400); } },
  // 云端拉取时合并导入元数据: 按文件名去重(本机优先, 同名不覆盖), 返回新增条数
  mergeList(list){ if(!Array.isArray(list)||!list.length) return 0;
    const cur=this.all(); const names=new Set(cur.map(x=>x.name)); let added=0;
    list.forEach(x=>{ if(x&&x.name&&!names.has(x.name)){ cur.push(x); names.add(x.name); added++; } });
    if(added) this._save(cur); return added; }
};

/* ================= 达标分数与过关概率 (P5-G) =================
   双口径: ①正态近似 = 历次模考 μ/σ → P(得分≥达标线); ②趋势外推 = 得分对日期线性回归, 外推到考试日再求概率 */
function erf(x){ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x);
  const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y; }
function normCdf(mu,sd,x){ return sd>0?0.5*(1+erf((x-mu)/(sd*Math.SQRT2))):(x>=mu?1:0); }
const Pass={
  target(){ return Math.max(1,+ST.settings.targetScore||132); },
  compute(){
    const recs=[...ST.exams].sort((a,b)=>(a.date||"")<(b.date||"")?-1:1);
    const scores=recs.map(e=>+e.score||0);
    const n=scores.length;
    const tgt=this.target();
    const out={n,target:tgt,normalP:null,trendP:null,projected:null,mu:null,sd:null,slope:0};
    if(!n) return out;
    const mu=scores.reduce((a,b)=>a+b,0)/n;
    const sd=n>1?Math.sqrt(scores.reduce((a,b)=>a+(b-mu)*(b-mu),0)/(n-1)):Math.max(3,mu*0.06);
    out.mu=Math.round(mu*10)/10; out.sd=Math.round(sd*10)/10;
    out.normalP=Math.max(0,Math.min(100,Math.round(normCdf(mu,sd,tgt)*100)));
    if(n>=2&&ST.settings.examDate){
      const xs=recs.map(e=>new Date(e.date).getTime()/864e5);
      const mx=xs.reduce((a,b)=>a+b,0)/n;
      let num=0,den=0; for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(scores[i]-mu); den+=(xs[i]-mx)*(xs[i]-mx); }
      const slope=den?num/den:0; out.slope=Math.round(slope*1000)/1000;   // 分/天
      const last=scores[n-1];
      const daysTo=Math.max(0,Math.ceil((new Date(ST.settings.examDate+"T00:00:00")-Date.now())/864e5));
      out.projected=Math.round(Math.min(240,Math.max(0,last+slope*daysTo)));
      out.trendP=Math.max(0,Math.min(100,Math.round(normCdf(out.projected,Math.max(sd,3),tgt)*100)));
    }
    return out;
  },
  line(){ const c=this.compute();
    if(!c.n) return '<span class="muted">暂无模考成绩, 完成 1 套模考后这里估算过关概率 (达标线 '+c.target+" 分, 可在学习计划①修改)。</span>";
    let s=`达标线 <b>${c.target}</b> 分 · 已有 ${c.n} 次模考 · 均值 ${c.mu}±${c.sd}`;
    if(c.normalP!=null) s+=` · <b>当前概率约 <span style="color:${c.normalP>=60?"var(--ok)":c.normalP>=35?"#d68910":"var(--bad)"}">${c.normalP}%</span></b> (正态)`;
    if(c.trendP!=null) s+=` · 趋势外推考试日约 <b>${c.projected}</b> 分 → <b>${c.trendP}%</b>`;
    else if(c.n<2) s+=` · <span class="muted">再做 1 次模考可启用趋势外推</span>`;
    return s;
  }
};

/* ================= 周复盘 ================= */
/* 近 7 天完成率 / 正确率 / 闪卡 / 模考 → 给出下周动态调整建议 */
const WeeklyReview={
  compute(){
    const days=[]; for(let i=6;i>=0;i--){ const dt=fmtD(new Date(Date.now()-i*864e5));
      days.push({dt,d:ST.daily[dt]||{b:0,ok:0,cards:0}}); }
    const target=+ST.settings.dailyBrush||50;
    const studied=days.filter(x=>x.d.b>0).length;
    const totalB=days.reduce((a,x)=>a+x.d.b,0);
    const ideal=target*7;
    const compRate=ideal?Math.round(totalB/ideal*100):0;
    const totalOk=days.reduce((a,x)=>a+x.d.ok,0);
    const acc=totalB?Math.round(totalOk/totalB*100):null;
    const cards=days.reduce((a,x)=>a+x.d.cards,0);
    const dts=new Set(days.map(x=>x.dt));
    const exams=ST.exams.filter(e=>{ const dd=(e.date||"").slice(0,10); return dts.has(dd); }).length;
    const sug=[];
    if(compRate>=90) sug.push("本周完成率优秀, 可维持节奏, 或小幅加量冲击薄弱章节。");
    else if(compRate<50) sug.push("完成率偏低, 建议用番茄钟固定每日学习时段, 先保证基础题量达标。");
    else sug.push("完成率中等, 下周目标把每日题量补到目标的 80% 以上。");
    if(acc!==null){ if(acc<60) sug.push("正确率低于 60%, 优先用「刷本章」回炉薄弱章节, 别急着赶进度。");
      else if(acc<75) sug.push("正确率尚可, 错题本集中清一遍即可。");
      else sug.push("正确率稳定, 可进入提速 / 模考阶段。"); }
    if(exams===0) sug.push("本周未做模考, 建议周末安排 1 套全真模考检验水平。");
    else sug.push("本周已完成 "+exams+" 套模考, 据报告里低分章节优先补强。");
    return {days,target,studied,totalB,ideal,compRate,totalOk,acc,cards,exams,sug};
  }
};
function vWeekly(){
  const el=$("#main"); const r=WeeklyReview.compute();
  const bars=r.days.map(x=>{ const pct=r.target?Math.min(100,Math.round(x.d.b/r.target*100)):0;
    const col=pct>=80?"var(--ok)":pct>=40?"var(--warn)":"var(--bad)";
    return `<div class="row" style="margin:3px 0;gap:8px">
      <span class="muted" style="width:46px">${x.dt.slice(5)}</span>
      <div class="bar grow"><i style="width:${pct}%;background:${col}"></i></div>
      <span class="muted" style="width:120px;text-align:right">${x.d.b}题 · ${x.d.ok?Math.round(x.d.ok/x.d.b*100):0}%对 · ${x.d.cards}卡</span></div>`;}).join("");
  el.innerHTML=`<h2>周复盘 <span class="muted" style="font-size:12px">近 7 天</span></h2>
  <div class="card"><div class="kv">
    <div class="item"><div class="muted">学习天数</div><div class="num">${r.studied} / 7</div></div>
    <div class="item"><div class="muted">完成率</div><div class="num">${r.compRate}%</div></div>
    <div class="item"><div class="muted">总题量</div><div class="num">${r.totalB}</div></div>
    <div class="item"><div class="muted">正确率</div><div class="num">${r.acc!=null?r.acc+"%":"—"}</div></div>
    <div class="item"><div class="muted">复习卡</div><div class="num">${r.cards}</div></div>
    <div class="item"><div class="muted">模考</div><div class="num">${r.exams}</div></div>
  </div>
  <div style="margin-top:12px"><b class="muted" style="font-size:12px">每日题量 (目标 ${r.target}/天)</b>${bars}</div></div>
  <div class="card"><h2 style="font-size:14px">过关概率估算</h2>
    <div style="font-size:13px;line-height:1.8">🎯 ${Pass.line()}</div>
    <div class="muted" style="margin-top:6px;font-size:11.5px">正态 = 按历次模考均值/波动估算; 趋势 = 按近期提分速度外推到考试日。样本越多越准, 达标线在学习计划①设置。</div></div>
  <div class="card"><h2 style="font-size:14px">下周动态调整建议</h2>
    ${r.sug.map(s=>`<div class="row" style="margin:6px 0"><span class="muted">▸</span><span style="font-size:13.5px">${esc(s)}</span></div>`).join("")}
    <div class="muted" style="margin-top:8px">完成率 = 近7天实际题量 ÷ (目标×7)；正确率 = 近7天做对 ÷ 已做。规律复习比突击更重要。</div></div>`;
}
/* 首页周复盘卡片 */
function renderWeekly(box){
  if(!box) return;
  const r=WeeklyReview.compute();
  box.innerHTML=`<div class="kv">
    <div class="item"><div class="muted">完成率</div><div class="num">${r.compRate}%</div></div>
    <div class="item"><div class="muted">正确率</div><div class="num">${r.acc!=null?r.acc+"%":"—"}</div></div>
    <div class="item"><div class="muted">学习</div><div class="num">${r.studied}/7天</div></div>
    <div class="item"><div class="muted">模考</div><div class="num">${r.exams}</div></div></div>
  <div class="muted" style="margin-top:6px;font-size:12.5px">🎯 ${Pass.line()}</div>
  <div class="muted" style="margin-top:4px;font-size:12.5px">${esc(r.sug[0]||"保持节奏")} <a href="#weekly" style="color:var(--pri)">查看周复盘</a></div>`;
}

  }
})();
