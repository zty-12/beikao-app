<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --line:#e9eaf3; --tx:#26272b; --tx2:#82869b;
  --pri:#5b5ce2; --pri-deep:#4748c9; --pri-weak:#eeeefe;
  --ok:#189a58; --ok-bg:#e6f7ee; --bad:#e5484d; --bad-bg:#fdebec;
  --warn:#c47f17; --warn-bg:#fdf3e0; --side:#ffffff; --side-tx:#565a72;
  --shadow:0 1px 2px rgba(35,35,80,.04),0 4px 16px rgba(35,35,80,.06);
}
[data-theme="dark"]{
  --bg:#15181e; --card:#1f232b; --line:#333a45; --tx:#e6e8ec; --tx2:#9aa4b2;
  --pri:#7b7cf0; --pri-deep:#6667e0; --pri-weak:#2a2b45; --ok:#4caf7d; --ok-bg:#1d2b23;
  --bad:#ef6b6b; --bad-bg:#33201f; --warn:#d9a04a; --warn-bg:#2e2617; --side:#1a1d26; --side-tx:#aeb8c8;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
#app{display:flex;min-height:100vh;max-width:1280px;margin:0 auto;box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(35,35,80,.08)}
#side{width:200px;background:var(--side);color:var(--side-tx);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:10;border-right:1px solid var(--line)}
#side .logo{padding:20px 18px 12px;font-weight:800;color:var(--pri);font-size:16.5px;letter-spacing:.5px}
#side nav{flex:1;padding:6px 10px;overflow-y:auto}
#side nav a{display:block;padding:9px 13px;margin:2px 0;color:var(--side-tx);text-decoration:none;font-size:13.5px;border-radius:9px;border-left:none;transition:.15s}
#side nav a:hover{background:var(--pri-weak);color:var(--pri)}
#side nav a.on{background:var(--pri);color:#fff;font-weight:500;box-shadow:0 3px 10px rgba(91,92,226,.35)}
#side .foot{padding:12px 16px;font-size:11px;color:var(--tx2)}
#main{flex:1;min-width:0;padding:24px 28px}
h2{font-size:19px;font-weight:700;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{background:var(--pri-deep)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid #c9c9f0}
.btn.ghost:hover{background:var(--pri-weak)}
.btn.gray{background:#eef0f4;color:var(--tx)}
.btn.gray:hover{background:#e2e5eb}
.btn.ok{background:var(--ok)} .btn.ok:hover{background:#137a46}
.btn.bad{background:var(--bad)} .btn.bad:hover{background:#cc353a}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
select,input,textarea{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;outline:none;transition:.15s}
select:focus,input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-weak)}
textarea{width:100%;font-family:Consolas,monospace}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:14px;line-height:1.55;transition:.15s}
.opt:hover{border-color:var(--pri);background:#fbfbff}
.opt.sel{border-color:var(--pri);background:var(--pri-weak);box-shadow:0 0 0 3px var(--pri-weak)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt b.key{display:inline-block;width:22px;color:var(--pri)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;background:var(--pri-weak);color:var(--pri);margin-right:5px;font-weight:500}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--tx2);font-size:12px}
.stem{font-size:15px;line-height:1.75;margin:8px 0 4px}
.analysis{background:#f7f8fd;border-radius:11px;padding:12px 14px;margin-top:10px;line-height:1.75;font-size:13.5px}
[data-theme="dark"] .analysis{background:var(--bg)}
.kv{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.kv .item{background:#f7f8fd;border-radius:12px;padding:12px 18px;min-width:120px}
[data-theme="dark"] .kv .item{background:var(--bg)}
.kv .num{font-size:22px;font-weight:800;color:var(--pri)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c7df2,var(--pri));border-radius:999px;transition:width .3s}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:#f7f8fd}
.flash{perspective:900px;cursor:pointer}
.flash .inner{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 26px;min-height:240px;line-height:1.85;font-size:15px}
.flash .q-title{font-size:17px;font-weight:600;line-height:1.7}
.grade{display:flex;gap:10px;margin-top:14px}
.grade .btn{flex:1;padding:11px 0;font-size:14px;border-radius:11px}
.list-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.grow{flex:1}
.tree-node{padding:3px 0}
.tree-node .lb{cursor:pointer;padding:4px 8px;border-radius:8px;display:flex;gap:6px;align-items:center;transition:.15s}
.tree-node .lb:hover{background:var(--pri-weak)}
.tree-kids{margin-left:18px;border-left:1px dashed var(--line);padding-left:10px}
.prog-mini{width:70px}
.sheet-q{display:inline-block;width:30px;height:26px;line-height:26px;text-align:center;border:1px solid var(--line);border-radius:8px;margin:3px;cursor:pointer;font-size:12px;transition:.15s}
.sheet-q:hover{border-color:var(--pri)}
.sheet-q.done{background:var(--pri);color:#fff;border-color:var(--pri)}
.sheet-q.flag{border-color:var(--warn);color:var(--warn)}
#snackbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#33364d;color:#fff;padding:10px 22px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#snackbar.show{opacity:.97}
.checkline{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.checkline input[type=checkbox]{width:16px;height:16px;accent-color:var(--pri)}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%), var(--line) 0);display:flex;align-items:center;justify-content:center;margin-right:12px}
.ring i{width:56px;height:56px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700}
.media-img{max-width:100%;border:1px solid var(--line);border-radius:10px}
/* 首页 hero */
.hero-card{background:linear-gradient(135deg,#5b5ce2 0%,#7c5ce2 60%,#9b6cf0 100%);border:none;color:#fff}
.hero-card .muted{color:rgba(255,255,255,.72)}
.hero-card .kv .item{background:rgba(255,255,255,.13)}
.hero-card .kv .num{color:#fff}
.hero-card .btn{background:#fff;color:var(--pri-deep);font-weight:600}
.hero-card .btn:hover{background:#f0efff}
.hero-card .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.45)}
.hero-card .btn.ghost:hover{background:rgba(255,255,255,.24)}
/* ---- 移动端: 隐藏侧栏, 改用底部导航 ---- */
#mnav{display:none}
@media(max-width:760px){
  #side{display:none}
  #main{padding:12px 12px calc(66px + env(safe-area-inset-bottom))}
  #mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;overflow-x:auto;-webkit-overflow-scrolling:touch;
    background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px;
    box-shadow:0 -2px 14px rgba(35,35,80,.08)}
  #mnav a{flex:0 0 auto;padding:7px 11px;font-size:12.5px;color:var(--tx2);text-decoration:none;border-radius:9px;white-space:nowrap}
  #mnav a.on{background:var(--pri);color:#fff;font-weight:500}
  #app{box-shadow:none}
  .card{padding:14px;border-radius:12px}
  .kv{gap:8px}.kv .item{min-width:0;flex:1 1 44%;padding:10px 12px}.kv .num{font-size:19px}
  #main table{display:block;overflow-x:auto;white-space:nowrap}
  h2{font-size:18px}
  #snackbar{bottom:78px}
  .media-img{max-width:100%}
}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div class="logo">备考工作台</div>
    <nav id="nav"></nav>
    <div class="foot" id="foot"></div>
  </div>
  <div id="main"></div>
</div>
<nav id="mnav"></nav>
<div id="snackbar"></div>
<script>
"use strict";
/* ================= 数据(构建时注入) ================= */
const BANK = /*__BANK__*/window.__BANK_DATA__||{"schemaVersion":"0","chapters":[],"questions":[],"knowledgePoints":[],"examRules":[]};
const EMB = /*__EMB__*/window.__EMB_DATA__||{"model":"","dim":0,"n":0,"ids":[],"b64":""};

/* ================= 索引 ================= */
const IDX = {ch:{}, subs:{}, q:{}, kp:{}, kpKids:{}, books:{}};
function buildIndexes(){
  IDX.ch={}; IDX.subs={}; IDX.q={}; IDX.kp={}; IDX.kpKids={}; IDX.books={};
  (BANK.books||[]).forEach(b=>{ if(b&&b.bankId) IDX.books[String(b.bankId).toUpperCase()]=b; });
  for(const c of BANK.chapters||[]){
    IDX.ch[c.id]=c;
    for(const s of c.children||[]) IDX.subs[s.id]={...s,chId:c.id,chTitle:c.title};
  }
  for(const q of BANK.questions||[]) IDX.q[q.id]=q;
  for(const k of BANK.knowledgePoints||[]){
    IDX.kp[k.id]=k;
    (IDX.kpKids[k.parentId]=IDX.kpKids[k.parentId]||[]).push(k.id);
  }
}
function chapPath(cid){
  if(IDX.subs[cid]){const s=IDX.subs[cid];return (IDX.ch[s.chId]||{}).title+" · "+s.title;}
  return (IDX.ch[cid]||{}).title||cid;
}
function Q(id){ // 应用校对覆盖
  const q=IDX.q[id]; if(!q) return null;
  const ov=ST.overrides[id];
  return ov? {...q,...ov,answer:{...q.answer,...(ov.answer||{})}} : q;
}
function allQ(){ return BANK.questions.map(q=>Q(q.id)).filter(Boolean); }

/* ---- 书籍元数据: 内置题库 + 导入题库统一视图 (真实标题/源文件名) ---- */
let _bmCache=null,_bmSig=null;
function bookMetaAll(){
  let raw=null; try{ raw=localStorage.getItem("bk-imports"); }catch(e){}
  const sig=raw?raw.length+":"+((raw.match(/"name"/g)||[]).length):"0";
  if(_bmCache&&_bmSig===sig) return _bmCache;
  const list=(BANK.books||[]).map(b=>{ const t=b.title||(b.source&&b.source.fileName)||String(b.bankId||"");
    return {tag:String(b.bankId||"").toLowerCase(),title:t,short:t.length>14?t.slice(0,13)+"…":t,book:b}; });
  Imports.all().forEach((imp,i)=>{ let d=null; try{ d=JSON.parse(imp.json); }catch(e){ return; }
    if(d&&(d.questions||[]).length&&!((d.knowledgePoints||[]).length)){
      const t=imp.name.replace(/\.json$/i,"");
      list.push({tag:"i"+i+"_",title:t,short:t.length>14?t.slice(0,13)+"…":t,imp:true}); } });
  _bmCache=list; _bmSig=sig; return list;
}
/* 章节范围匹配: 选「章」即含其下所有「节」(a1 命中 a1 / a1-2), 空列表 = 不限 */
function chMatch(cid,list){ return (!list||!list.length)?true:list.some(c=>cid===c||cid.startsWith(c+"-")); }
function bookOfCh(cid){ if(!cid) return null;
  const l=bookMetaAll();
  for(let i=l.length-1;i>=0;i--){ const t=l[i].tag; if(cid===t||cid.startsWith(t)) return l[i]; }
  return null; }

/* ================= 本地存储 (IndexedDB + localStorage 兜底) ================= */
const ST = {progress:{}, srs:{}, settings:{examDate:"",examName:"注册环保工程师·基础考试",dailyNew:20,dailyBrush:50,
  weekdayMin:90,weekendMin:240,subjects:{},theme:"light",srsMode:"sm2",targetAcc:70,targetScore:132,subjMigrated:false,learnRatio:{base:60,mid:40,sprint:15},
  supabaseUrl:"",supabaseKey:""}, plan:{}, exams:[], examTemplates:[], holidays:[], syllabus:[], taskDays:{}, holidayCache:{},
  overrides:{}, daily:{}, lib:{read:{},time:{},excerpts:[]}, treeMerges:{}, videos:[]};
const SKEYS=["progress","srs","settings","plan","exams","overrides","daily","lib","videos","aiPlan",
  "examTemplates","holidays","syllabus","taskDays","holidayCache","treeMerges"];
const ST_DEF=JSON.parse(JSON.stringify(ST));   // 出厂默认值快照, 供「全量覆盖导入」复位
let _mem={};
const Store={
  async init(){
    try{
      await new Promise((res,rej)=>{
        const rq=indexedDB.open("beikao",1);
        rq.onupgradeneeded=e=>e.target.result.createObjectStore("kv");
        rq.onsuccess=e=>{Store.db=e.target.result;res();};
        rq.onerror=()=>rej(rq.error);
      });
      await Promise.all(SKEYS.map(k=>new Promise(res=>{
        const r=Store.db.transaction("kv").objectStore("kv").get(k);
        r.onsuccess=()=>{_mem[k]=r.result||null;res();}; r.onerror=()=>res();
      })));
    }catch(e){ Store.db=null; SKEYS.forEach(k=>{_mem[k]=localStorage.getItem("bk_"+k);}); }
    SKEYS.forEach(k=>{ if(_mem[k]) try{ST[k]=JSON.parse(_mem[k]);}catch(_){} });
    ST.settings=Object.assign({examDate:"",examName:"注册环保工程师·基础考试",dailyNew:20,dailyBrush:50,weekdayMin:90,weekendMin:240,subjects:{},theme:"light",srsMode:"sm2",targetAcc:70,targetScore:132,subjMigrated:false,learnRatio:{base:60,mid:40,sprint:15},supabaseUrl:"",supabaseKey:""},ST.settings);
  },
  db:null,
  async save(k){
    const v=JSON.stringify(ST[k]);
    try{
      if(Store.db){
        const tx=Store.db.transaction("kv","readwrite");
        tx.objectStore("kv").put(v,k);
      } else localStorage.setItem("bk_"+k,v);
    }catch(e){ localStorage.setItem("bk_"+k,v); }
  },
  async saveAll(){ for(const k of SKEYS) await Store.save(k); }
};
/* ================= Supabase 增量同步 (合并而非整体覆盖) =================
   多设备场景: 拉取时只把云端数据「合并」进本机, 不抹掉本机独有进度;
   推送时把全部 SKEYS + 导入题库元数据(bk-imports)一起上传。 */
const Sync={
  _mergeArr(L,C){ const byId={}; (L||[]).forEach(x=>{ if(x&&x.id!==undefined) byId[x.id]=x; });
    (C||[]).forEach(x=>{ if(x&&x.id!==undefined) byId[x.id]=x; else byId["_"+Math.random()]=x; }); return Object.values(byId); },
  _mergeObj(L,C){ const o={}; const ks=new Set([...Object.keys(L||{}),...Object.keys(C||{})]);
    for(const k of ks){ const lv=(L||{})[k], rv=(C||{})[k];
      if(lv===undefined) o[k]=rv;
      else if(rv===undefined) o[k]=lv;
      else if(Array.isArray(lv)&&Array.isArray(rv)) o[k]=Sync._mergeArr(lv,rv);
      else if(lv&&typeof lv==="object"&&rv&&typeof rv==="object") o[k]=Sync._mergeObj(lv,rv);
      else o[k]=rv; }
    return o; },
  _mergeDaily(L,C){ const o=Object.assign({},L); for(const dt of Object.keys(C||{})){
    if(!o[dt]) o[dt]=Object.assign({},C[dt]);
    else { const a=o[dt],b=C[dt];
      o[dt]={b:(a.b||0)+(b.b||0),ok:(a.ok||0)+(b.ok||0),cards:(a.cards||0)+(b.cards||0),
        h:Array.from({length:24},(_,i)=>(a.h?a.h[i]||0:0)+(b.h?b.h[i]||0:0))}; } }
    return o; },
  _mergeLib(L,C){ return { read:Sync._mergeObj(L.read||{},C.read||{}),
    time:Sync._mergeObj(L.time||{},C.time||{}), excerpts:Sync._mergeArr(L.excerpts||[],C.excerpts||[]) }; },
  // cloud = 云端 payload {progress,srs,...,imports}
  pull(cloud){ const c=cloud||{};
    if(c.settings) ST.settings=Object.assign({},c.settings,
      {supabaseUrl:ST.settings.supabaseUrl,supabaseKey:ST.settings.supabaseKey,ai:ST.settings.ai||c.settings.ai});
    for(const k of ["progress","srs","overrides","daily","plan","aiPlan","taskDays","treeMerges"]) if(c[k]!==undefined) ST[k]=Sync._mergeObj(ST[k]||{},c[k]);
    if(c.exams) ST.exams=Sync._mergeArr(ST.exams||[],c.exams);
    if(c.videos) ST.videos=Sync._mergeArr(ST.videos||[],c.videos);
    if(c.examTemplates) ST.examTemplates=Sync._mergeArr(ST.examTemplates||[],c.examTemplates);
    if(c.syllabus) ST.syllabus=Sync._mergeArr(ST.syllabus||[],c.syllabus);
    if(c.lib) ST.lib=Sync._mergeLib(ST.lib||{},c.lib);
    if(Array.isArray(c.imports)&&c.imports.length) Imports.mergeList(c.imports);
  },
  // 推送 payload: 含导入题库元数据
  pushPayload(){ const data={}; SKEYS.forEach(k=>data[k]=ST[k]); data.imports=Imports.all(); return data; }
};
/* 统一按"本机时区"取日期(yyyy-mm-dd)。此前用 UTC(toISOString), 与 fmtD(本地)在 00:00-08:00 会差一天, 导致今日任务读不到当天安排。 */
function today(){ return fmtD(new Date()); }
function dkey(){ const d=ST.daily[today()]||{b:0,ok:0,cards:0,h:Array(24).fill(0)}; if(!d.h) d.h=Array(24).fill(0); ST.daily[today()]=d; return d; }

/* ================= 通用 UI ================= */
const $=s=>document.querySelector(s);
function toast(m){ const t=$("#snackbar");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* 轻量选择弹窗: 返回所选 val (Promise), 用于导入/覆盖等二选一场景 */
function ask(msg,opts){
  return new Promise(res=>{
    const d=document.createElement("div");
    d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9999";
    d.innerHTML=`<div class="card" style="max-width:440px"><div style="margin-bottom:12px;line-height:1.6">${msg}</div>
      <div class="row" style="justify-content:flex-end">${opts.map((o,i)=>
        `<button class="btn sm ${o.cls||""}" data-i="${i}">${esc(o.label)}</button>`).join(" ")}</div></div>`;
    d.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{ d.remove(); res(opts[+b.dataset.i].val); });
    d.onclick=e=>{ if(e.target===d){ d.remove(); res(opts[opts.length-1].val); } };
    (document.body||document.documentElement).appendChild(d);
  });
}
function subT(s){ s=esc(s); if(s.includes("$")) return s;   // 含 LaTeX 时不做下标替换, 交给 KaTeX
  return s.replace(/([A-Za-zμγλρσθφωΩΔαβ])_([A-Za-z0-9]{1,4})/g, "$1<sub>$2</sub>"); }
function renderMath(el){
  if(window.renderMathInElement){ try{renderMathInElement(el,{delimiters:[
    {left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],
    throwOnError:false});}catch(e){} }
}
/* 知识点 content: 转义后保留 $...$ 公式(交给 KaTeX), 段落按换行拆分 */
function kpContentHTML(kp){
  const c=(kp.content||"").trim();
  if(!c) return '<span class="muted">（无内容）</span>';
  const lines=c.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const head=/^(\d+[.、)）]|[（(]\d+[)）]|[a-zA-Z][.、)）])/;
  const numbered=lines.filter(s=>head.test(s)).length;
  if(lines.length>1 && numbered>=lines.length*0.6){
    return "<ol style='margin:6px 0 6px 20px;line-height:1.9;padding-left:18px'>"+lines.map(s=>{
      const t=s.replace(/^(\d+[.、)）]|[（(]\d+[)）]|[a-zA-Z][.、)）])\s*/,"");
      return `<li style="margin:3px 0">${esc(t)}</li>`; }).join("")+"</ol>";
  }
  return lines.map(s=>`<p style="margin:5px 0">${esc(s)}</p>`).join("");
}
/* 语音听题 TTS: 用浏览器 SpeechSynthesis 朗读题干+选项 (中文) */
const TTS={
  _plain(s){ return (s||"").replace(/\$[^$]*\$/g," ").replace(/[`*_#]/g," ").replace(/\s+/g," ").trim(); },
  q(id){ const q=Q(id); if(!q) return; const o=(q.options||[]).map(x=>x.key+". "+this._plain(x.text)).join("；"); this.speak(this._plain(q.stem)+"。"+(o?"选项："+o:"")); },
  speak(text){ try{
    if(!("speechSynthesis" in window)){ toast("当前环境不支持语音朗读"); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN"; u.rate=1; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const zh=voices.find(v=>/zh|Chinese/i.test(v.lang||v.name));
    if(zh) u.voice=zh;
    window.speechSynthesis.speak(u);
  }catch(e){ toast("朗读失败: "+e.message); } },
  stop(){ try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(e){} }
};
/* 相似题推荐: 构建期 bge-small-zh 句向量(L2归一化→int8量化→base64) + 运行时余弦 topK, 零依赖/离线 */
const Similar={
  _vec:null,_row:null,
  ready(){ return !!(EMB&&EMB.dim>0&&EMB.n>0&&EMB.b64); },
  _build(){ if(this._vec) return true;
    if(!this.ready()) return false;
    try{
      const bin=atob(EMB.b64), n=EMB.n, d=EMB.dim;
      const v=new Int8Array(n*d);
      for(let i=0;i<bin.length;i++) v[i]=bin.charCodeAt(i)<<24>>24;
      this._vec=v;
      this._row={}; for(let i=0;i<n;i++) this._row[EMB.ids[i]]=i;
      return true;
    }catch(e){ console.warn("Similar build failed",e); return false; }
  },
  topK(id,k){ k=k||5;
    if(!this._build()) return [];
    const r=this._row[id]; if(r===undefined) return [];
    const d=EMB.dim, v=this._vec, off=r*d, N=EMB.n, K=127*127;
    const scores=[];
    for(let i=0;i<N;i++){
      if(i===r) continue;
      let s=0; const o=i*d;
      for(let j=0;j<d;j++) s+=v[off+j]*v[o+j];
      scores.push([EMB.ids[i], s/K]);
    }
    scores.sort((a,b)=>b[1]-a[1]);
    return scores.slice(0,k);
  },
  panel(id){
    if(!this.ready()){ toast("相似题向量未构建(需先跑 scripts/embed_bank.py 并重新构建)"); return; }
    const t0=performance.now();
    const list=this.topK(id,5);
    const ms=Math.round(performance.now()-t0);
    const cur=Q(id);
    const rows=list.map(([qid,cos])=>{
      const q=Q(qid); if(!q) return "";
      const ak=(q.answer&&(q.answer.keys||[]).join("/")||q.answer&&q.answer.resolved||"?");
      return `<div style="padding:7px 0;border-bottom:1px solid var(--ln, #eee)">
        <div class="row" style="gap:6px;flex-wrap:wrap"><span class="tag">${esc(q.book||"")}</span>
          <span class="muted" style="font-size:11px">${esc(chapPath(q.chapterId))} · 相似度 ${(cos*100).toFixed(0)}% · 答案 ${esc(ak)}</span></div>
        <div style="margin-top:3px;font-size:13px">${esc((q.stem||"").slice(0,80))}${(q.stem||"").length>80?"…":""}</div>
        <div style="margin-top:3px"><a href="#" style="color:var(--pri);font-size:12px" onclick="Similar.close();location.hash='#brush';Brush.jump&&Brush.jump('${qid}');return false">去刷此题 →</a></div></div>`;
    }).join("");
    let ov=document.getElementById("sim-ov");
    if(!ov){ ov=document.createElement("div"); ov.id="sim-ov";
      ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:flex;align-items:center;justify-content:center";
      ov.onclick=e=>{ if(e.target===ov) this.close(); };
      document.body.appendChild(ov); }
    ov.innerHTML=`<div style="background:var(--bg,#fff);color:var(--tx,#222);max-width:520px;width:92%;max-height:80vh;overflow:auto;border-radius:12px;padding:14px 16px">
      <div class="row"><b>相似题 · ${esc((cur&&cur.stem||"").slice(0,24))}…</b>
        <button class="btn sm ghost" style="margin-left:auto" onclick="Similar.close()">关闭</button></div>
      <div class="muted" style="font-size:11px;margin:4px 0 2px">bge-small-zh 语义向量 · 余弦 top5 · 检索 ${ms}ms</div>
      ${rows||'<div class="muted">未找到相似题</div>'}</div>`;
  },
  close(){ const ov=document.getElementById("sim-ov"); if(ov) ov.remove(); }
};

  if(f.ch){ const arr=Array.isArray(f.ch)?f.ch:[f.ch];      // P6: 支持多章节数组(本周范围定向刷题)
    qs=qs.filter(q=>arr.some(c=>q.chapterId===c||q.chapterId.startsWith(c+"-")||chapPath(q.chapterId).includes(c))); }
  if(f.scope==="unseen") qs=qs.filter(q=>prog(q.id).a===0);
  if(f.scope==="wrong") qs=qs.filter(q=>prog(q.id).w>0&&!prog(q.id).mastered);

Brush.pick=function(k){

  document.querySelectorAll("#opts .opt").forEach(b=>{
    if(b.dataset.k===k) b.classList.add(right?"right":"wrong");
    if(resolved&&b.dataset.k===resolved&&right===false) b.classList.add("right");
    b.style.pointerEvents="none";
  });
  p.a++; p.last=Date.now(); p.lastQ=id;
  if(right) p.c++; else { p.w++; p.mastered=false; }
  const d=dkey(); d.b++; if(right)d.ok++; d.h[new Date().getHours()]++;
  ST.progress[id]=p; Store.save("progress"); Store.save("daily");
  Brush.reveal();
  Brush.clearAuto();
  $("#verdict").innerHTML=right
    ?'<span class="muted">回答正确</span>'
    :'<span class="muted">回答错误 · 已加入错题本, 请查看解析后手动点「下一题」</span>';
  if(right) Brush.autoT=setTimeout(()=>{ Brush.autoT=null; if(location.hash==="#brush"&&Brush.pos<Brush.queue.length-1) Brush.nav(1); },2000);
};
Brush.reveal=function(silent){
  const id=Brush.queue[Brush.pos]; const q=Q(id);
  document.querySelectorAll("#opts .opt").forEach(b=>{
    if(q.answer.resolved&&b.dataset.k===q.answer.resolved) b.classList.add("right");
    b.style.pointerEvents="none";
  });
  $("#ana").style.display="block"; renderMath($("#ana"));
};
Brush.flag=function(){
  const id=Brush.queue[Brush.pos]; const p=prog(id); p.flag=!p.flag;
  ST.progress[id]=p; Store.save("progress"); drawQ();
};
Brush.nav=function(d){
  Brush.clearAuto();
  Brush.pos=Math.max(0,Math.min(Brush.queue.length-1,Brush.pos+d));
  Brush.showA=false; drawQ();
};
Brush.jump=function(qid){  // 相似题跳转: 队列内有则直达, 无则追加到队尾(不破坏当前队列)
  Brush.clearAuto();
  let i=Brush.queue.indexOf(qid);
  if(i<0){ Brush.queue.push(qid); i=Brush.queue.length-1; }
  Brush.pos=i; Brush.showA=false; drawQ();
};
function wireKeys(){
  if(Brush.keyHandler) document.removeEventListener("keydown",Brush.keyHandler);
  Brush.keyHandler=e=>{
    if(location.hash!=="#brush") return;
    if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
    if(e.key>="1"&&e.key<="4"){ const b=document.querySelectorAll("#opts .opt")[+e.key-1]; if(b)b.click(); }
    else if(e.key==="ArrowRight") Brush.nav(1);
    else if(e.key==="ArrowLeft") Brush.nav(-1);
    else if(e.key==="r"||e.key==="R"){ $("#ana").style.display=$("#ana").style.display==="none"?"block":"none"; }
    else if(e.key==="f"||e.key==="F") Brush.flag();
  };
  document.addEventListener("keydown",Brush.keyHandler);
}

  sections:[{type:"single_choice",count:60,scorePerQuestion:1,preferWrong:false}]};
const TYPE_LABEL={single_choice:"单选题",multi_choice:"多选题",judge:"判断题",true_false:"判断题",fill:"填空题",case:"案例题",short_answer:"简答题"};
Exam.typeOptions=function(sel){
  const set=new Set((BANK.questions||[]).map(q=>q.type).filter(Boolean));
  if(!set.size) set.add("single_choice");
  return [...set].map(t=>`<option value="${t}" ${t===sel?"selected":""}>${TYPE_LABEL[t]||t}</option>`).join("");

Exam.qPoolCount=function(books,chapters){
  let p=allQ().filter(q=>q.stem&&q.options&&q.options.length>=2&&!q.incomplete&&q.answer&&q.answer.resolved)
    .filter(q=>books.length&&books.some(b=>q.chapterId.startsWith(b)));
  p=p.filter(q=>chMatch(q.chapterId,chapters));
  return p.length;
};
Exam.renderCustom=function(){

      <label>数量 <input type="number" min="1" value="${s.count}" style="width:60px" oninput="Exam.custom.sections[${i}].count=Math.max(1,+this.value||1);Exam.updateSummary()"> 题</label>
      <label>每题 <input type="number" min="0.5" step="0.5" value="${s.scorePerQuestion}" style="width:60px" oninput="Exam.custom.sections[${i}].scorePerQuestion=Math.max(0.5,+this.value||1);Exam.updateSummary()"> 分</label>
      <label class="muted"><input type="checkbox" ${s.preferWrong?"checked":""} onchange="Exam.custom.sections[${i}].preferWrong=this.checked;Exam.updateSummary()"> 只抽错题</label>

    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="Exam.addSec()">＋ 添加题型段落</button></div>
    <div class="row" style="margin-top:10px;align-items:center">
      <b class="muted" style="font-size:12px">章节范围：</b>
      <span id="ch-scope-label" class="muted">全部章节</span>
      <button class="btn sm ghost" onclick="Exam.toggleChPicker()">选择章节</button>
      <span class="muted" style="font-size:11px">· 也可给每个段落单独「指定章节」(如高数3题、流体力学4题)</span></div>
    <div id="chapter-picker" style="display:none;border:1px solid rgba(128,128,128,.35);border-radius:8px;padding:8px;margin-top:6px;max-height:260px;overflow:auto"></div>

Exam.addSec=function(){
  const t=(BANK.questions||[]).map(q=>q.type).filter(Boolean);
  this.custom.sections.push({type:t[0]||"single_choice",count:20,scorePerQuestion:1,preferWrong:false,chapterIds:[]});
  this.renderCustom();
};
Exam.delSec=function(i){
  this.custom.sections.splice(i,1);
  if(!this.custom.sections.length) this.custom.sections.push({type:"single_choice",count:20,scorePerQuestion:1,preferWrong:false});
  this.renderCustom();
};
Exam.effBooks=function(){
  const c=this.custom, chs=c.chapters||[];
  if(chs.length) return [...new Set(chs.map(id=>{ const m=bookOfCh(id); return m?m.tag:(id[0]||"a").toLowerCase(); }))];
  if(!c.books) c.books=Object.fromEntries(bookMetaAll().map(b=>[b.tag,true]));
  return Object.keys(c.books).filter(k=>c.books[k]);
};
Exam.updateSummary=function(){
  const c=this.custom, sum=$("#custom-summary"); if(!sum) return;
  const chs=c.chapters||[];
  const books=this.effBooks();
  const total=c.sections.reduce((a,s)=>a+s.count*s.scorePerQuestion,0);
  const totalQ=c.sections.reduce((a,s)=>a+s.count,0);
  const pool=this.qPoolCount(books,chs);
  const parts=[];
  parts.push(`总分 <b>${+total.toFixed(1)}</b> 分 · 共 <b>${totalQ}</b> 题 · 时长 ${c.duration} 分钟`);
  parts.push(books.length?`覆盖 ${books.map(t=>{ const m=bookMetaAll().find(x=>x.tag===t); return esc(m?m.short:t); }).join("/")}`:`<span style="color:#c0392b">未选择任何书</span>`);
  if(chs.length) parts.push(`章节 <b>${chs.length}</b> 节`);
  if(books.length) parts.push(`范围内可用 <b>${pool}</b> 题`);
  let warn="";
  if(books.length&&totalQ>pool) warn=` <a style="color:#c0392b;cursor:pointer;text-decoration:underline" onclick="Exam.fitToPool(${pool})">⚠ 超出可用题数, 点击自动调整为 ${pool} 题</a>`;
  sum.innerHTML=parts.join(" · ")+warn;
  const lbl=$("#ch-scope-label"); if(lbl) lbl.textContent=chs.length?("已选 "+chs.length+" 节"):"全部章节";
  c.sections.forEach((s,i)=>{ const sp=$("#row-ch-"+i); if(!sp) return;
    if(s.chapterIds&&s.chapterIds.length){
      const rp=this.qPoolCount(this.rowBooksOf(s),s.chapterIds);
      sp.textContent="限"+s.chapterIds.length+"节 · 可用"+rp+"题";
      sp.style.color=rp<s.count?"#c0392b":"";
    } else { sp.textContent=""; } });
  const ta=$("#rule-json"); if(ta) ta.value=JSON.stringify(this.buildCustomRule(),null,1);
};
Exam.rowBooksOf=function(s){
  return [...new Set((s.chapterIds||[]).map(id=>{ const m=bookOfCh(id); return m?m.tag:(id[0]||"a").toLowerCase(); }))];
};
Exam.buildCustomRule=function(){
  const c=this.custom;
  const booksSet=new Set(this.effBooks());
  c.sections.forEach(s=>this.rowBooksOf(s).forEach(b=>booksSet.add(b)));   // 段落章节隐含的书并入总范围
  const books=[...booksSet];
  const chs=(c.chapters&&c.chapters.length)?[...c.chapters]:undefined;
  const sections=c.sections.map(s=>Object.assign(
    {type:s.type,count:s.count,scorePerQuestion:s.scorePerQuestion,knowledgeWeight:{},difficultyDist:{},preferWrong:!!s.preferWrong},
    (s.chapterIds&&s.chapterIds.length)?{chapterIds:[...s.chapterIds]}:{}));
  const totalScore=sections.reduce((a,s)=>a+s.count*s.scorePerQuestion,0);
  const rule={id:"rule-custom",name:c.name||"自定义模拟卷",totalScore:+totalScore.toFixed(1),durationMinutes:Math.max(1,c.duration|0),scopeBooks:books,coverage:"all",sections};
  if(chs) rule.scopeChapters=chs;
  return rule;
};
Exam.beginCustom=function(){
  const c=this.custom, chs=c.chapters||[];
  const books=this.effBooks();
  if(!books.length&&!c.sections.some(s=>s.chapterIds&&s.chapterIds.length)){ toast("请至少勾选一本书或选择章节作为覆盖范围"); return; }
  for(let i=0;i<c.sections.length;i++){ const s=c.sections[i];
    if(s.chapterIds&&s.chapterIds.length){
      const rp=this.qPoolCount(this.rowBooksOf(s),s.chapterIds);
      if(s.count>rp){ toast("段落"+(i+1)+" 抽题数 "+s.count+" 超过所选章节可用 "+rp+" 题, 请调整"); return; } } }
  const pool=this.qPoolCount(books,chs);
  const totalQ=c.sections.reduce((a,s)=>a+s.count,0);
  if(!c.sections.every(s=>s.chapterIds&&s.chapterIds.length)&&totalQ>pool){ toast("抽题总数 "+totalQ+" 超过范围内可用题数 "+pool+", 请调整"); return; }
  this._run(this.buildCustomRule());
};
Exam.fitToPool=function(pool){
  const secs=this.custom.sections;
  const totalQ=secs.reduce((a,s)=>a+s.count,0);
  if(!totalQ||!pool) return;
  let acc=0;
  secs.forEach(s=>{ s.count=Math.max(1,Math.floor(s.count*pool/totalQ)); acc+=s.count; });
  if(acc>pool) secs[0].count=Math.max(1,secs[0].count-(acc-pool));
  else if(acc<pool) secs[0].count+=pool-acc;
  this.renderCustom();
  toast("已将抽题数量调整为 "+pool+" 题");
};
/* ---- 章节选择 & 预设规则载入 ---- */
Exam.loadRule=function(id){
  const r=(BANK.examRules||[]).find(x=>x.id===id); if(!r) return;

    sections:(r.sections||[]).map(s=>({type:s.type||"single_choice",count:s.count||10,scorePerQuestion:s.scorePerQuestion||1,preferWrong:!!s.preferWrong,chapterIds:[]}))};
  if(!this.custom.sections.length) this.custom.sections=[{type:"single_choice",count:20,scorePerQuestion:1,preferWrong:false,chapterIds:[]}];
  this.renderCustom();

Exam.chTarget={mode:"global",row:-1};   // 当前章节选择器写入目标: 全局 or 某段落

Exam.pickRowCh=function(i){
  const box=$("#row-ch-picker"); if(!box) return;

  box.style.display=show?"block":"none";
  if(show){ this.chTarget={mode:"row",row:i}; this.renderChapterPicker(); }
};
Exam._selSet=function(){
  const t=this.chTarget;
  if(t.mode==="row"){ const s=this.custom.sections[t.row]; return new Set(s.chapterIds||[]); }
  return new Set(this.custom.chapters||[]);
};
Exam._writeSet=function(set){
  const t=this.chTarget;
  if(t.mode==="row") this.custom.sections[t.row].chapterIds=[...set];
  else this.custom.chapters=[...set];
};
Exam.clearRowCh=function(){
  if(this.chTarget.mode==="row"){ this.custom.sections[this.chTarget.row].chapterIds=[];
    this.renderChapterPicker(); this.updateSummary(); }
};
Exam.qCountBySub=function(){
  const m={};
  allQ().forEach(q=>{ if(q.stem&&q.options&&q.options.length>=2&&!q.incomplete&&q.answer&&q.answer.resolved) m[q.chapterId]=(m[q.chapterId]||0)+1; });
  return m;
};
Exam.renderChapterPicker=function(){
  const box=this.chTarget.mode==="row"?$("#row-ch-picker"):$("#chapter-picker"); if(!box) return;
  const openIds=[...box.querySelectorAll("details[open]")].map(d=>d.dataset.ch);
  const sel=this._selSet();
  const cnt=this.qCountBySub();
  const head=`<div class="row" style="margin-bottom:6px;align-items:center">
    <span class="muted" style="font-size:12px">${this.chTarget.mode==="row"?("为段落 "+(this.chTarget.row+1)+" 选择章节(只在该段落抽题):"):"全局章节范围(所有段落受限):"}</span>
    ${this.chTarget.mode==="row"?`<button class="btn sm ghost" onclick="Exam.clearRowCh()">清除限定</button>`:""}</div>`;
  box.innerHTML=head+((BANK.chapters||[]).map(ch=>{
    const subs=ch.children||[];

      <label style="display:inline-flex;align-items:center;gap:4px"><input type="checkbox" ${allSel?"checked":""} onchange="Exam.toggleCh('${ch.id}',this.checked)">
      <b style="font-size:12px">${esc(ch.title)}</b> <span class="muted">(${n}题)</span></label></summary>
      <div style="margin:4px 0 4px 20px">${subs.map(s=>`<label style="display:inline-block;margin:2px 10px 2px 0;font-size:12px"><input type="checkbox" ${sel.has(s.id)?"checked":""} onchange="Exam.toggleSub('${s.id}',this.checked)"> ${esc(s.title)} <span class="muted">(${cnt[s.id]||0})</span></label>`).join("")||"<span class='muted'>无小节</span>"}</div></details>`;
  }).join("")||"<span class='muted'>题库无章节信息</span>");
};
Exam.toggleCh=function(chId,on){
  const ch=(BANK.chapters||[]).find(c=>c.id===chId); if(!ch) return;
  const set=this._selSet();
  (ch.children||[]).forEach(s=> on?set.add(s.id):set.delete(s.id));
  this._writeSet(set);
  this.renderChapterPicker(); this.updateSummary();
};
Exam.toggleSub=function(id,on){
  const set=this._selSet();
  on?set.add(id):set.delete(id);
  this._writeSet(set);
  this.updateSummary();
};
Exam.begin=function(id){
  const r=(BANK.examRules||[]).find(x=>x.id===id); if(r) this._run(r);
};
/* ---- 真实考试卷一键填充 + 科目组成导入 (P5-B) ---- */
Exam.togglePartsImport=function(){ const box=$("#parts-import-box"); if(box) box.style.display=box.style.display==="none"?"block":"none"; };
Exam.presetReal=function(){
  const sj=Plan.syllabus().filter(s=>(s.examCount||0)>0);
  const covered=sj.filter(s=>(s.chapters||[]).length);
  const noCh=sj.filter(s=>!(s.chapters||[]).length);
  if(!covered.length){ toast("考纲科目均未关联题库章节, 请先在学习计划③配置"); return; }
  this.custom={name:"全真模拟·"+(ST.settings.examName||"基础考试"),duration:240,books:null,chapters:[],
    sections:covered.map(s=>({type:"single_choice",count:s.examCount,scorePerQuestion:s.score||1,preferWrong:false,
      chapterIds:[...s.chapters],subj:s.title}))};

};

Exam._run=function(rule,rng){
  rng=rng||Math.random;
  const used=new Set(); const paper=[];
  for(const sec of rule.sections||[]){
    let pool=allQ().filter(q=>q.stem&&q.options.length>=2&&!q.incomplete)
      .filter(q=>!rule.scopeBooks||rule.scopeBooks.some(b=>q.chapterId.startsWith(b.toLowerCase())))
      .filter(q=>chMatch(q.chapterId,rule.scopeChapters))
      .filter(q=>chMatch(q.chapterId,sec.chapterIds));
    if(!sec.preferWrong) pool=pool.filter(q=>q.answer.resolved);   // 判分优先有答案题
    // 加权: 错题 x3, 未做 x2
    const weighted=[];
    for(const q of pool){ let w=1; const p=prog(q.id);
      if(sec.preferWrong){ if(p.w>0&&!p.mastered) w=5; else continue; }
      else { if(p.w>0) w=3; else if(p.a===0) w=2; }
      for(let i=0;i<w;i++) weighted.push(q);
    }
    const picks=[];
    while(picks.length<Math.min(sec.count,weighted.length? new Set(weighted.map(q=>q.id)).size:0)){
      const q=weighted[Math.floor(rng()*weighted.length)];
      if(used.has(q.id)||picks.includes(q)) continue;
      picks.push(q); used.add(q.id);
    }
    paper.push({name:sec.type,count:sec.count,score:sec.scorePerQuestion,qs:picks.map(q=>q.id)});
  }
  if(!paper.some(s=>s.qs.length)){ toast("抽不到题, 请检查规则覆盖范围"); return; }
  this.rule=rule; this.paper=paper; this.answers={}; this.flags={}; this.cur=0;
  this.start=Date.now();
  this.timer=setInterval(()=>this.tick(),1000);
  this.draw();
};
/* 可选: 业务无关的确定性随机(用于「固定种子」模考模板, 每次组出同一套卷) */
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
Exam.tick=function(){
  const left=(this.rule.durationMinutes*60)-Math.floor((Date.now()-this.start)/1000);
  const t=$("#exam-timer"); if(t) t.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(left<=0){ clearInterval(this.timer); toast("时间到, 自动交卷"); this.submit(); }
};

/* ================= 闪卡 + SRS (SM-2 / 艾宾浩斯) ================= */
/* 艾宾浩斯遗忘曲线固定复习节点(天): 学后第 1/2/4/7/15/30/90/180 天各复习一次 */
const EB=[1,2,4,7,15,30,90,180];
/* 把知识点正文按「编号小点」拆成多张卡: 1. / （一） / a. / 1、 等作为小点起点, 其余行并入上一小点 */
function splitKpPoints(ct){
  const lines=String(ct||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(lines.length<=1) return [ct];
  const head=/^(\d+[.、)）]|[（(]\d+[)）]|[a-zA-Z][.、)）])/;
  const pts=[]; let cur=null;
  for(const ln of lines){
    if(head.test(ln)){ if(cur!==null) pts.push(cur); cur=ln; }
    else cur=(cur===null)?ln:(cur+"\n"+ln);
  }
  if(cur!==null) pts.push(cur);
  return pts.length?pts:[ct];
}
function allCards(){
  const isNum=t=>/^\d+(\.\d+)*$/.test(String(t||"").trim());
  const cCards=[], bCards=[], cards=[];
  // C 书实际提供了具体知识点正文的章节号集合(用于跳过被覆盖的 B 考点提纲)
  const cCovered=new Set();
  for(const kp of BANK.knowledgePoints||[]){
    if(kp.sourceBook==="C"&&(kp.content||"").trim()&&!isNum(kp.title))
      cCovered.add(String(kp.chapterId||"").replace(/^\D+/,""));
  }
  for(const kp of BANK.knowledgePoints||[]){
    const ct=(kp.content||"").trim();
    if(!ct||isNum(kp.title)) continue;          // 空壳/纯编号骨架节点不入卡池
    if(kp.sourceBook==="C"){
      // 按编号小点拆卡: 每个要点一张知识卡, 首要点沿用 kc:<id> 保证与知识树「生成复习卡」联动
      const pts=splitKpPoints(ct);
      pts.forEach((pt,i)=>{
        const id=i===0?"kc:"+kp.id:("kc:"+kp.id+"#"+i);
        cCards.push({id,type:"kp",front:pts.length>1?`${kp.title} (${i+1}/${pts.length})`:kp.title,back:pt,kpId:kp.id,ch:kp.chapterId});
        const sents=pt.split(/[。;；]/).filter(s=>/\$[^$]+\$|\d/.test(s)&&s.length>6).slice(0,1);
        sents.forEach((s,j)=>{ const m=s.match(/\$([^$]+)\$|(\d+\.?\d*)/); if(!m) return;
          const blank=m[1]||m[2];
          cCards.push({id:`cl:${kp.id}:${i}:${j}`,type:"cloze",front:s.replace(blank,"▢▢▢"),back:blank,kpId:kp.id,ch:kp.chapterId}); });
      });
    }else{
      // B 书仅有考点提纲; 该章已被 C 具体知识点覆盖时跳过, 避免提纲卡刷屏
      const chNum=String(kp.chapterId||"").replace(/^\D+/,"");
      if(cCovered.has(chNum)) continue;
      bCards.push({id:"kc:"+kp.id,type:"outline",front:kp.title,back:ct,kpId:kp.id,ch:kp.chapterId});
    }
  }
  cards.push(...cCards,...bCards);
  for(const q of allQ()){
    const p=prog(q.id);
    if(p.w>0&&!p.mastered&&q.stem){
      cards.push({id:"wc:"+q.id,type:"wrong",front:"错题回顾: "+q.stem,
        back:`答案 ${q.answer.resolved||"待校对"}<br>${esc(q.analysis||"")}`,qid:q.id,ch:q.chapterId});
    }
  }
  return cards;
}
function dueCards(){
  const now=Date.now(); const cards=allCards(); const due=[];
  for(const c of cards){ const s=ST.srs[c.id];
    if(!s) continue; if((s.due||0)<=now) due.push(c); }
  return due;
}
function newCards(limit){
  const cards=allCards(); const fresh=cards.filter(c=>!ST.srs[c.id]);
  return fresh.slice(0,limit);
}

Cards.grade=function(g){
  const c=Cards.cur; const now=Date.now();
  let s=ST.srs[c.id]||{due:now,iv:0,ef:2.5,reps:0,eb:0};
  const wasNew=(s.reps||0)===0;
  if(ST.settings.srsMode==="eb"){
    // 艾宾浩斯固定节点: 评"记得"(>=3)推进到下一节点, 评"忘了"(<3)回退到首节点重学
    if(g>=3){
      s.eb=Math.min((s.eb||0)+1, EB.length);
      const idx=Math.min(s.eb-1, EB.length-1);
      s.due=now + EB[idx]*864e5;
      s.reps=(s.reps||0)+1;
      if(s.eb>=EB.length){ s.mastered=true; }
    } else {
      s.eb=0; s.due=now; s.reps=0;
    }
  } else {
    const q=[1,3,4,5][g-1];
    if(q<3){ s.reps=0; s.iv=1; }
    else{ s.reps++; s.iv=s.reps===1?1:s.reps===2?6:Math.round(s.iv*s.ef); s.ef=Math.max(1.3,s.ef+(0.1-(5-q)*0.08+(4-q)*0.02)); }
    s.due=now+s.iv*864e5; s.last=now;
  }
  ST.srs[c.id]=s;
  const d=dkey(); d.cards++;
  Store.save("srs"); Store.save("daily");
  if(c.type==="wrong"){ /* 卡片掌握不动错题状态, 由错题本管理 */ }
  if(wasNew){
    if(ST.settings.srsMode==="eb"){
      if(s.eb>=EB.length) toast("已掌握, 进入年度复习");
      else toast("已加入复习: "+(EB[(s.eb-1)])+" 天后回顾");
    } else toast("已加入复习队列 (SM-2 自适应)");
  }
  Cards.next();
};
/* 当前卡片的艾宾浩斯复习节点进度(供记忆曲线面板展示) */
Cards.ebSchedule=function(cardId){
  const s=ST.srs[cardId]; if(!s||ST.settings.srsMode!=="eb") return null;
  const done=Math.min(s.eb||0, EB.length);
  return EB.map((d,i)=>({day:d,done:i<done,next:i===done&&!s.mastered}));
};

/* ================= 知识树 ================= */
function kpMastery(kpId){
  const kids=(IDX.kpKids[kpId]||[]); let m=kids.length?0:null;
  for(const kid of kids){ const km=kpMastery(kid); if(km!==null) m=(m||0)+km; }
  if(m!==null&&kids.length) return m/kids.length;
  const kp=IDX.kp[kpId]; if(!kp) return null;
  const qs=allQ().filter(q=>(q.knowledgePointIds||[]).includes(kpId)&&prog(q.id).a>0);
  const s=ST.srs["kc:"+kpId];
  let score=0;
  if(qs.length) score+=qs.filter(q=>prog(q.id).c>prog(q.id).w).length/qs.length*0.7;
  if(s) score+=Math.min(1,(s.reps||0)/4)*0.3;
  return score>0?score:(qs.length||s?score:null);
}

const CN={零:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,两:2};
function cn2n(s){   // 中文数字 → 整数 (支持 十一 / 二十 / 一百二十三)
  s=String(s||"").replace(/[零〇]/g,"");
  let n=0,cur=0;
  for(const ch of s){
    if(ch==="十"){ cur=(cur||1)*10; n+=cur; cur=0; }
    else if(ch==="百"){ cur=(cur||1)*100; n+=cur; cur=0; }
    else if(ch==="千"){ cur=(cur||1)*1000; n+=cur; cur=0; }
    else if(ch in CN){ cur=CN[ch]; }
  }
  return n+cur;
}
const Tree={
  /* 标题编号形态识别 → {cls, val|key}
     cls 0: 第X章 / 一、二、    cls 1: （一）    cls 2: 1. 或 1、    cls 3: 多级编号 1.2 / 1.2.3 */
  kpShape(t){
    t=String(t||"").trim(); let m;
    if((m=t.match(/^第\s*([一二三四五六七八九十百]+)\s*[章节篇部]/))) return {cls:0,val:cn2n(m[1])};
    if((m=t.match(/^([一二三四五六七八九十百]+)\s*[、．.,]/)))   return {cls:0,val:cn2n(m[1])};
    if((m=t.match(/^[（(]\s*([一二三四五六七八九十百]+)\s*[）)]/))) return {cls:1,val:cn2n(m[1])};
    if((m=t.match(/^(\d+(?:\.\d+)+)/)))  return {cls:3,key:m[1].split(".").map(Number)};
    if((m=t.match(/^(\d+)\s*[、．.](?!\d)/))) return {cls:2,val:+m[1]};
    return null;
  },
  kpKey(t){ const s=this.kpShape(t); if(!s) return null;
    return s.cls===3?s.key:[s.cls,s.val]; },
  kpCmp(a,b){ const ka=this.kpKey(a),kb=this.kpKey(b);
    if(!ka&&!kb) return 0; if(!ka) return 1; if(!kb) return -1;
    for(let i=0;i<Math.max(ka.length,kb.length);i++){ const x=ka[i]===undefined?-1:ka[i], y=kb[i]===undefined?-1:kb[i];
      if(x!==y) return x-y; } return 0; },
  chapterKids(cid){
    let kids=(IDX.kpKids[cid]||[]).slice();
    const assigned=new Set(kids);
    // 无 parentId 的编号型知识点(如导入资料的 10.1/10.2): 无编号父级才算章直属主支
    Object.keys(IDX.kp).forEach(id=>{ const k=IDX.kp[id];
      if(k.chapterId!==cid||assigned.has(id)) return;
      const realParent=k.parentId&&IDX.kp[k.parentId]&&k.parentId!==cid;
      const numParent=this._numParentOf&&this._numParentOf[id];
      if(!realParent&&!numParent) kids.push(id); });
    return kids.sort((x,y)=>this.kpCmp((IDX.kp[x]||{}).title,(IDX.kp[y]||{}).title));
  },
  _calcNumTree(){   // 依据标题编号推断父子, 供无 parentId 的资料分主支/次支
    this._numKids={}; this._numParentOf={};
    const kps=(BANK.knowledgePoints||[]).filter(k=>IDX.kp[k.id]);
    // ① 多级阿拉伯编号 (10.1 → 10.1.1): 按编号前缀找父级
    const byKey={};
    for(const k of kps){ const s=this.kpShape(k.title||"");
      if(s&&(s.cls===3||s.cls===2)&&k.chapterId)
        byKey[k.chapterId+"#"+(s.cls===3?s.key:[s.val]).join(".")]=k.id; }   // cls2 "10." 也登记, 供 "10.1" 认父
    for(const k of kps){ const s=this.kpShape(k.title||"");
      if(s&&s.cls===3&&s.key.length>1&&k.chapterId){
        const pid=byKey[k.chapterId+"#"+s.key.slice(0,-1).join(".")];
        if(pid&&pid!==k.id){ (this._numKids[pid]=this._numKids[pid]||[]).push(k.id); this._numParentOf[k.id]=pid; } } }
    // ② 中文序号体系 (一、 → （一） → 1.): 按文档顺序用单调栈挂层级
    const byCh={};
    for(const k of kps){ const s=this.kpShape(k.title||"");
      if(!s||s.cls===3) continue;
      (byCh[k.chapterId||""]=byCh[k.chapterId||""]||[]).push({id:k.id,cls:s.cls}); }
    for(const cid in byCh){
      const stack=[];
      for(const n of byCh[cid]){
        while(stack.length&&stack[stack.length-1].cls>=n.cls) stack.pop();
        const p=stack.length?stack[stack.length-1]:null;
        if(p&&p.id!==n.id&&!this._numParentOf[n.id]){
          (this._numKids[p.id]=this._numKids[p.id]||[]).push(n.id); this._numParentOf[n.id]=p.id; }
        stack.push(n);
      }
    }
    // ③ 显式 level 字段 (无编号导入资料的层级): 按文档顺序用单调栈挂父级
    const byChL={};
    for(const k of kps){ if(k.level===undefined||k.level===null) continue;
      if(this.kpShape(k.title||"")) continue;   // 已有编号则交给上面的编号逻辑
      (byChL[k.chapterId||""]=byChL[k.chapterId||""]||[]).push({id:k.id,lv:+k.level}); }
    for(const cid in byChL){
      const stack=[];
      for(const n of byChL[cid]){
        while(stack.length&&stack[stack.length-1].lv>=n.lv) stack.pop();
        const p=stack.length?stack[stack.length-1]:null;
        if(p&&p.id!==n.id&&!this._numParentOf[n.id]){
          (this._numKids[p.id]=this._numKids[p.id]||[]).push(n.id); this._numParentOf[n.id]=p.id; }
        stack.push(n);
      }
    }
  },
  /* ---- P7: 标题归一键 —— 去掉「第X章/编号/括注/空白标点」后比对, 跨资料同名知识点自动归并 ---- */
  _normKey(t){
    return String(t||"").toLowerCase()
      .replace(/^第\s*[0-9一二三四五六七八九十百]+\s*[章节篇][\s、.．:·]*/,"")
      .replace(/^(\d+(?:\.\d+)*|[一二三四五六七八九十百]+)\s*[、.．:]\s*/,"")
      .replace(/[（(][^）)]*[)）]/g,"")
      .replace(/[\s、，,·.．:：—\-_'"]/g,"").trim();
  },
  /* 科目 -> 该科目全部知识点 id (跨 a/b/c 多份资料) */
  _subjectKps(sj){
    const chs=(sj.chapters||[]).map(c=>Plan.topCh(c));
    const out=[];
    for(const k of BANK.knowledgePoints||[]){
      if(!IDX.kp[k.id]) continue;
      if(chs.includes(Plan.topCh(k.chapterId||""))) out.push(k.id);
    }
    return out;
  },
  /* 科目 -> 归并后的层级树 [{id,kids:[...],src}] (同层同名归并, 内容取更全者) */
  _buildSubjTree(sj){
    const ids=this._subjectKps(sj);
    const inSubj=new Set(ids);
    const merges=(ST.treeMerges||{})[sj.id]||{};
    const keyOf=id=>{ const k=this._normKey((IDX.kp[id]||{}).title||id); return merges[k]||k; };
    const childrenOf=id=>[...new Set([...(IDX.kpKids[id]||[]),...((this._numKids&&this._numKids[id])||[])])]
      .filter(x=>inSubj.has(x)&&x!==id);
    const childSet=new Set(); ids.forEach(id=>childrenOf(id).forEach(c=>childSet.add(c)));
    const mergeSibs=list=>{
      const byKey={},out=[];
      for(const nd of list){
        const k=keyOf(nd.id);
        if(!byKey[k]){ byKey[k]=nd; out.push(nd); }
        else{ const t=byKey[k]; t.src=(t.src||1)+1;
          const a=IDX.kp[t.id]||{}, b=IDX.kp[nd.id]||{};
          if((b.content||"").length>(a.content||"").length) t.id=nd.id;
          t.kids=mergeSibs(t.kids.concat(nd.kids)); }
      }
      return out.sort((x,y)=>this.kpCmp((IDX.kp[x.id]||{}).title,(IDX.kp[y.id]||{}).title));
    };
    const build=(id,depth)=>{
      const kids=depth>10?[]:childrenOf(id).map(c=>build(c,depth+1));
      return {id,kids,src:1};
    };
    return mergeSibs(ids.filter(id=>!childSet.has(id)).map(id=>build(id,0)));
  },
  draw(){
    const kw=($("#tree-q").value||"").toLowerCase();
    const sid=($("#tree-subj")||{}).value||"";
    this._calcNumTree();
    const list=Plan.syllabus().filter(s=>!sid||s.id===sid);
    const html=list.map(sj=>{
      const root=this._buildSubjTree(sj);
      const kids=root.map(nd=>this.node(nd,kw,0)).join("");
      if(!kids) return "";
      return `<details class="tree-node" open><summary style="cursor:pointer;list-style:none"><b>${esc(sj.title)}</b>
        <span class="muted" style="font-size:11px;margin-left:6px">${root.length} 个主支</span></summary>
        <div class="tree-kids">${kids}</div></details>`;
    }).join("");
    $("#tree-box").innerHTML=html||'<span class="muted">该科目暂无知识点资料 — 到「资料库」导入含知识点的教材/讲义后自动汇总到这里</span>';
    this._mind=false;   // 列表态
    const mb=$("#tree-mind-btn"); if(mb) mb.textContent="🌳 思维导图";
  },
  node(nd,kw,depth){
    const kp=IDX.kp[nd.id]||{};
    const title=kp.title||nd.id;
    const match=!kw||(title||"").toLowerCase().includes(kw)||(kp.content||"").toLowerCase().includes(kw);
    const kids=nd.kids.map(k=>this.node(k,kw,depth+1)).join("");
    if(kw&&!match&&!kids) return "";
    const m=kpMastery(nd.id); const pct=m===null?0:Math.round(m*100);
    const bar=`<span class="prog-mini bar"><i style="width:${pct}%;background:${pct>70?"var(--ok)":pct>30?"var(--warn)":"var(--bad)"}"></i></span>
      <span class="muted" style="width:34px;text-align:right">${m===null?"-":pct+"%"}</span>`;
    const srcTag=nd.src>1?`<span class="tag" style="font-size:10px" title="多份资料同名知识点已归并">×${nd.src} 源</span>`:"";
    if(!nd.kids.length)
      return `<div class="tree-node"><div class="lb" onclick="Tree.detail('${nd.id.replace(/"/g,"")}')"><span style="color:var(--tx2)">·</span><span class="grow">${esc(title)}</span>${srcTag}${bar}</div></div>`;
    return `<details class="tree-node" ${depth<1||kw?"open":""}><summary style="cursor:pointer;list-style:none">
        <span class="grow" onclick="event.preventDefault();Tree.detail('${nd.id.replace(/"/g,"")}')">${esc(title)}</span>${srcTag}${bar}</summary>
      <div class="tree-kids">${kids}</div></details>`;
  },
  _parentOf(id){ if(IDX.kp[id]&&IDX.kp[id].parentId&&IDX.kp[IDX.kp[id].parentId]) return IDX.kp[id].parentId;
    if(this._numParentOf&&this._numParentOf[id]) return this._numParentOf[id]; return null; },
  pathOf(id){ const arr=[]; let cur=id,g=0;
    while(cur&&g++<20){ const k=IDX.kp[cur]; if(!k)break; arr.unshift(k.title); cur=this._parentOf(cur); } return arr; },
  detail(id){
    const kp=IDX.kp[id]; const box=$("#tree-detail"); if(!kp){ return; }
    this._calcNumTree();
    const path=this.pathOf(id);
    const crumb=path.length>1?`<div class="muted" style="font-size:12px;margin-bottom:2px">${path.slice(0,-1).map(t=>esc(t)).join(" › ")}</div>`:"";
    const depthLabel=path.length>1?` · 第 ${path.length} 级`:"";
    box.innerHTML=`<div class="card"><h2 style="font-size:15px">${esc(kp.title||id)}</h2>${crumb}
      <div class="muted" style="font-size:11px;margin-bottom:6px">所属章节: ${esc(chapPath(kp.chapterId))}${depthLabel}</div>
      <div class="kp-content" style="line-height:1.85;margin:10px 0">${kpContentHTML(kp)}</div>
      ${kp.media&&kp.media.length?`<div style="margin:8px 0">${kp.media.map(m=>`<img class="media-img" src="${mediaSrc(m)}" alt="配图" style="max-width:100%;border-radius:6px;margin:4px 0" onerror="this.style.display='none'">`).join("")}</div>`:""}
      ${(kp.tags||[]).length?`<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:4px">${kp.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
      ${kp.sourcePage?`<div class="muted" style="margin-top:6px;font-size:12px">出处: ${esc(kp.sourceBook||"")} p${esc(kp.sourcePage)}</div>`:""}
      <div class="row" style="margin-top:10px"><button class="btn sm" onclick="Tree.review('${id.replace(/"/g,"")}')">生成今日复习卡</button>
        <span class="muted" style="font-size:11px;align-self:center" id="tree-card-n"></span></div></div>`;

  /* ---- P7: 思维导图(SVG 树状图, 按当前科目; 层级截到 3 层, 更深并入叶子) ---- */

  mind(){
    const sid=($("#tree-subj")||{}).value||"";
    this._calcNumTree();
    const H=24,GAP=7,W=150,DW=175;
    let y=10; const nodes=[],links=[]; let maxd=0,count=0;
    const trunc=t=>{ t=String(t||""); return t.length>15?t.slice(0,14)+"…":t; };
    const place=(nd,d)=>{
      count++; maxd=Math.max(maxd,d);
      const t=trunc((IDX.kp[nd.id]||{}).title||nd.id);
      if(!nd.kids.length||d>=3){
        const my=y; nodes.push({x:d*DW,y:my,t,leaf:1,d}); y+=H+GAP;
        return {top:my,ctr:my+H/2};
      }
      const cs=nd.kids.map(k=>place(k,d+1));
      const ctr=(cs[0].ctr+cs[cs.length-1].ctr)/2;
      nodes.push({x:d*DW,y:ctr-H/2,t,d});
      cs.forEach(c=>links.push({x1:d*DW+W,y1:ctr,x2:(d+1)*DW,y2:c.ctr}));
      return {top:cs[0].top,ctr};
    };
    const roots=Plan.syllabus().filter(s=>!sid||s.id===sid);
    for(const sj of roots){
      const root=this._buildSubjTree(sj);
      if(!root.length) continue;
      const sy=y; y+=H+GAP;
      const cs=root.map(k=>place(k,1));
      const ctr=(cs[0].ctr+cs[cs.length-1].ctr)/2;
      nodes.push({x:0,y:sy,t:trunc(sj.title),root:1,d:0});
      cs.forEach(c=>links.push({x1:W,y1:sy+H/2,x2:DW,y2:c.ctr}));
    }
    if(!nodes.length||count>500){ $("#tree-box").innerHTML=count>500?'<span class="muted">节点过多, 请先在右侧选择单一科目再生成导图</span>':'<span class="muted">暂无知识点可生成导图</span>'; return; }
    const COL=["var(--pri)","#8e44ad","#d68910","#27ae60"];
    const svg=`<svg width="${(maxd+1)*DW+20}" height="${y+10}" style="min-width:100%">`
      +links.map(l=>`<path d="M${l.x1} ${l.y1} C ${l.x1+40} ${l.y1}, ${l.x2-40} ${l.y2}, ${l.x2} ${l.y2}" fill="none" stroke="rgba(128,128,128,.45)" stroke-width="1.2"/>`).join("")
      +nodes.map(n=>`<g><rect x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="6" fill="${n.root?COL[0]:COL[Math.min(n.d,3)]}" opacity="${n.leaf?0.75:0.95}"/><text x="${n.x+8}" y="${n.y+16}" font-size="11" fill="#fff">${esc(n.t)}</text></g>`).join("")
      +"</svg>";

  },
  /* ---- P7: AI 辅助归并 —— 把同科目内疑似重复的知识点标题交给 AI 判断, 结果持久化到 ST.treeMerges ---- */
  async aiMerge(){

      for(let i=0;i<kps.length;i++) for(let j=i+1;j<kps.length;j++){
        const a=kps[i].t,b=kps[j].t; if(!a||!b) continue;
        const na=this._normKey(a),nb=this._normKey(b);
        if(na===nb||na.length<6||nb.length<6) continue;
        if(na.indexOf(nb)===0||nb.indexOf(na)===0) cands.push({sjId:sj.id,a,b});
        if(cands.length>=60) break;
      }
      if(cands.length>=60) break;
    }
    if(!cands.length){ toast("未发现疑似重复的知识点"); return; }
    const box=$("#tree-box"); if(box) box.innerHTML='<div class="muted">🤖 AI 正在判断 '+cands.length+' 组疑似重复知识点…</div>';

${cands.map((c,i)=>`${i+1}|${c.a}|${c.b}`).join("\n")}
只输出 JSON: {"dup":[1,3,...]} (dup 里只填确实是同一知识点的编号; 一个都没有则 {"dup":[]})`;
      const j=await aiChat(prompt,{temperature:0,timeout:300000});

function fmtD(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
/* 放弃科目: 按考纲科目展开为题库章节集合(向后兼容旧的按章节 key) */
function skipSet(){ const s=new Set();
  const map=ST.settings.subjects||{};
  for(const sj of (typeof Plan!=="undefined"&&Plan.syllabus?Plan.syllabus():SYLLABUS_PRESET)){
    const ov=map[sj.id];
    if(ov&&ov.mode==="skip") (sj.chapters||[]).forEach(c=>s.add(c));
  }
  // 兼容旧数据: 直接以章节 id 标记的放弃
  for(const [k,v] of Object.entries(map)) if(v&&v.mode==="skip"&&/^[abc]\d+$/.test(k)) s.add(k);
  return s; }
function isSkipQ(q){ const sk=skipSet(); return sk.size? [...sk].some(x=>q.chapterId===x||q.chapterId.startsWith(x+"-")) : false; }
/* 假期: ST.holidays=[{start,end,intensity}], 命中则返回 {start,end,intensity}; intensity 默认 0.4 */
function isHoliday(dt){
  dt=dt||today();
  for(const h of (ST.holidays||[])){
    if(h&&h.start&&h.end&&dt>=h.start&&dt<=h.end)
      return {start:h.start,end:h.end,intensity:(h.intensity!=null?+h.intensity:0.4)};
  }
  return null;
}
/* 指定日期的每日目标刷题量 (供层级计划/任务落位/校准复用; 今天之外的天不做"剩余题量"上限) */
function dayTargetFor(dt,noHoliday){
  const s=ST.settings;
  const examD=s.examDate?new Date(s.examDate+"T00:00:00"):null;
  const days=examD?Math.max(0,Math.ceil((examD-new Date(dt+"T00:00:00"))/864e5)):null;
  const wknd=isWeekend(dt);
  const mins=wknd?(+s.weekendMin||240):(+s.weekdayMin||90);
  let brush=Math.max(5,Math.round(mins/2.2));
  if(days!==null&&days<=14) brush=0;                 // 冲刺期: 模考+错题为主
  const hd=noHoliday?null:isHoliday(dt);
  if(hd&&brush>0) brush=Math.max(3,Math.round(brush*(hd.intensity||0.4)));
  return {brush,wknd,holiday:isHoliday(dt),sprint:days!==null&&days<=14,days};
}
function planCompute(){
  const days=ST.settings.examDate? Math.max(0,Math.ceil((new Date(ST.settings.examDate)-Date.now())/864e5)):null;
  const qs=allQ().filter(q=>q.stem&&q.options.length>=2&&!q.incomplete&&!q.duplicateOf);
  const studyQs=qs.filter(q=>!isSkipQ(q));
  const unseen=studyQs.filter(q=>prog(q.id).a===0).length;
  // 近3天完成率 -> 调节系数
  let factor=1; const hist=[];
  for(let i=1;i<=3;i++){ const dt=fmtD(new Date(Date.now()-i*864e5)); const d=ST.daily[dt]; if(d)hist.push(d.b>=(ST.settings.dailyBrush||50)*0.8); }
  if(hist.length>=2){ const r=hist.filter(Boolean).length/hist.length; factor=r>=0.9?1.2:r>=0.5?1:0.8; }
  const sprint=days!==null&&days<=14;
  // 当日目标: 工作日/周末/假期统一由 dayTargetFor 折算, 再按剩余题量封顶
  // 注意: 先用"未扣假期"的基准做封顶, 再统一施加一次假期系数 —— 否则剩余题量的上限会把假期降额盖掉
  const tgtRaw=dayTargetFor(today(),1);
  const tgt=dayTargetFor(today());
  let brush=tgtRaw.brush?Math.min(200,Math.max(10,Math.min(tgtRaw.brush,Math.ceil(unseen/Math.max(days||30,1)*factor)))):0;
  if(tgt.holiday&&brush>0) brush=Math.max(3,Math.round(brush*(tgt.holiday.intensity||0.4)));
  const due=dueCards().length;
  return {days,unseen,factor,sprint,brush,due,wknd:tgt.wknd,holiday:tgt.holiday};
}

/* ---- AI 接口统一调用: 地址归一(补协议/去尾斜杠/智能拼 chat/completions) + 超时 + 友好错误 ---- */
async function aiChat(prompt,opts){
  opts=opts||{};
  const cfg=ST.settings.ai||{};
  if(!cfg.url||!cfg.key) throw new Error("请先到 设置 → AI 接口 填写接口地址与密钥");
  let u=String(cfg.url||"").trim();
  if(!/^https?:\/\//i.test(u)) u="https://"+u;               // 漏写协议时按 https 处理
  u=u.replace(/\/+$/,"");
  if(!/\/chat\/completions$/.test(u)) u+="/chat/completions"; // 已填完整端点则不重复拼接
  const ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  const tmo=opts.timeout||300000;
  const tm=setTimeout(()=>{ if(ctrl) ctrl.abort(); },tmo);
  try{
    let r;
    try{
      r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+cfg.key},
        body:JSON.stringify({model:cfg.model||"deepseek-chat",messages:[{role:"user",content:prompt}],
          temperature:opts.temperature==null?0.3:opts.temperature}),
        signal:ctrl?ctrl.signal:undefined});
    }catch(ne){
      const msg=String((ne&&ne.message)||ne);
      if(/abort/i.test(msg)) throw new Error("请求超时(超过 "+Math.round(tmo/1000)+" 秒)。本地大模型生成较慢可重试; 或在设置里换更快的模型/云接口");
      if(_LOCAL) throw new Error("网络请求失败("+msg+")。本地 file:// 打开时多数云接口不允许跨域, 请用线上版(https)或本地服务(如 Ollama/LM Studio, 并允许 CORS)");
      throw new Error("网络请求失败("+msg+")。请检查: 接口地址是否正确/可直达、服务商是否允许浏览器跨域(CORS)、网络是否可达。若用本地模型请确认服务已启动");
    }
    if(!r.ok){ const tx=await r.text().catch(()=>""); throw new Error("HTTP "+r.status+" "+String(tx).slice(0,160)); }
    return await r.json();
  }finally{ clearTimeout(tm); }
}

/* ---------- P7: 科目统一口径 ----------
   资料(视频/知识点)各自文件内部可保留自己的章节, 但一切统计/展示/计划一律归一到考纲科目。 */
/* 章节 id -> 考纲科目 */
subjOfCh(cid){ const t=this.topCh(cid);
  return this.syllabus().find(s=>(s.chapters||[]).some(c=>this.topCh(c)===t))||null; },
/* 名称 -> 考纲科目: 兼容「第10章 X」「10 X」「10.1 X」「X」等写法, 归一后精确/最长包含匹配 */
subjByName(name){
  const norm=s=>String(s||"").toLowerCase()
    .replace(/^第\s*[0-9一二三四五六七八九十百]+\s*[章节篇][\s、.．:·]*/,"")
    .replace(/^\d+(?:\.\d+)*\s*[、.．]?\s*/,"")
    .replace(/^[一二三四五六七八九十百]+\s*[、.．]\s*/,"")
    .replace(/[（(][^）)]*[)）]/g,"")
    .replace(/[\s、，,·.．:：—\-_'"]/g,"").trim();
  const n=norm(name); if(n.length<2) return null;
  const list=this.syllabus();
  const hit=list.find(s=>norm(s.title)===n); if(hit) return hit;
  let best=null,bl=0;
  for(const s of list){ const t=norm(s.title);
    if(t.length>=2&&(n.indexOf(t)>=0||t.indexOf(n)>=0)&&t.length>bl){ best=s; bl=t.length; } }
  return best;
},
/* 科目学习负荷: 知识点数 + 课程讲数/估时 + 剩余题量 (供 AI 排程分析与展示) */
subjLoad(id){
  const sj=this.syllabus().find(x=>x.id===id); if(!sj) return null;
  const chs=(sj.chapters||[]).map(c=>this.topCh(c));
  const kps=(BANK.knowledgePoints||[]).filter(k=>chs.includes(this.topCh(k.chapterId||""))
    &&(k.content||"").trim()&&!/^\d+(\.\d+)*$/.test(String(k.title||"").trim()));
  const vs=(ST.videos||[]).filter(v=>v&&(v.subjectId?v.subjectId===id:(chs.length&&chs.includes(this.topCh(v.chapterId)))));
  const estMin=vs.reduce((a,v)=>a+(v.dur>0?v.dur/60:25),0);

  return {id,kps:kps.length,lessons:vs.length,done:vs.filter(v=>vidPct(v)>=99).length,

/* 顶层章节 id: "a1-2" -> "a1" */
topCh(c){ return String(c||"").split("-")[0]; },
/* 科目 -> 该科目下尚未看完的视频(未看完优先, 其次按添加顺序)。视频优先按 subjectId 归属, 旧数据回退章节映射 */
courseOfSubj(id){

courseStat(id){ const sj=this.syllabus().find(x=>x.id===id); if(!sj) return {n:0,done:0};

  return {n:vs.length,done:vs.filter(v=>vidPct(v)>=99).length}; },
/* 阶段 -> 当日"听课占比"(0~1) */
ratioOf(phase){ const r=(ST.settings&&ST.settings.learnRatio)||{};
  const v=/冲刺/.test(phase||"")?r.sprint:/强化/.test(phase||"")?r.mid:r.base;
  return Math.max(0,Math.min(0.9,(v==null?0.5:+v)/100)); },
/* 日期 -> 所属周计划 {m 月, w 周, days 本周天数, idx 该天在周内的序号} */
weekOf(dt){
  const p=ST.plan; if(!p||!Array.isArray(p.months)) return null;
  for(const m of p.months) for(const w of (m.weeks||[])){
    if(w.start&&w.end&&dt>=w.start&&dt<=w.end){
      const days=Math.max(1,Math.round((new Date(w.end+"T00:00:00")-new Date(w.start+"T00:00:00"))/864e5)+1);
      const idx=Math.max(0,Math.round((new Date(dt+"T00:00:00")-new Date(w.start+"T00:00:00"))/864e5));
      return {m,w,days,idx};
    }
  }
  return null;
},

gen(aiAlloc){
  const s=ST.settings; const today0=today();
  const examDate=s.examDate||"";
  const days = examDate? Math.max(0, Math.ceil((new Date(examDate)-Date.now())/864e5)) : 90;
  const qs=allQ().filter(q=>q.stem&&q.options&&q.options.length>=2&&!q.incomplete&&!q.duplicateOf);
  const studyQs=qs.filter(q=>!isSkipQ(q));
  const total=studyQs.length;
  const done=studyQs.filter(q=>prog(q.id).a>0).length;
  const remaining=Math.max(0,total-done);
  const wk=Math.max(1,+(s.weekendFactor)||1.5);
  const pomo=Math.max(5,+(s.pomo)||25);
  const perMin=2.2, perNew=6;
  const brushW=Math.max(5,Math.round((+s.weekdayMin||90)/perMin));
  const brushE=Math.max(5,Math.round(((+s.weekendMin||240)*wk)/perMin));
  const newW=Math.max(0,Math.round((+s.weekdayMin||90)/perNew));
  const newE=Math.max(0,Math.round((+s.weekendMin||240)/perNew));
  const pc=planCompute(); const factor=pc.factor||1;
  // 按权重把每日题量分配到各科目(低优先级×0.5), 工作日给理解+综合, 周末给记忆+综合
  // 先给每个"仍有剩余题量"的活跃科目保底 1 题/天, 再按权重分配余数, 避免低优先级被舍入成 0
  const alloc=(dailyTotal,pool)=>{
    const active=pool.filter(x=>(x.qDone||0)<(x.qTotal||0));
    const eff=active.map(x=>({id:x.id,w:(x.weight||1)*(x.mode==="low"?0.5:1)}));
    const totW=eff.reduce((a,x)=>a+x.w,0)||1;
    const out={}; let rem=dailyTotal;
    active.forEach(x=>{ out[x.id]=rem>0?1:0; if(rem>0) rem--; });
    if(rem>0){
      const extra={}; eff.forEach(x=>extra[x.id]=Math.max(0,Math.round(rem*x.w/totW)));
      let diff=rem-Object.values(extra).reduce((a,b)=>a+b,0);
      const keys=Object.keys(extra).filter(k=>extra[k]>0||out[k]>0);
      let i=0; while(diff!==0&&keys.length){ const k=keys[i%keys.length]; const step=diff>0?1:-1; extra[k]+=step; diff-=step; i++; }
      eff.forEach(x=>out[x.id]+=extra[x.id]);
    }
    return out;
  };
  const subj=this.subjects().filter(x=>x.mode!=="skip");
  /* ---- P7: AI 排程分配(可选): order=主攻顺序, months[ym].focus=每月科目时间占比, mode=单科推进/混配 ---- */
  let aiInfo=null;
  {
    const allIds=subj.map(x=>x.id);
    const ord=(aiAlloc&&Array.isArray(aiAlloc.order)?aiAlloc.order:[]).filter(id=>allIds.includes(id));
    allIds.forEach(id=>{ if(!ord.includes(id)) ord.push(id); });
    const focus={};
    (aiAlloc&&Array.isArray(aiAlloc.months)?aiAlloc.months:[]).forEach(m=>{
      if(!m||!m.ym) return;
      const f=(Array.isArray(m.focus)?m.focus:[]).filter(x=>x&&allIds.includes(x.id)&&+x.pct>0)
        .map(x=>({id:x.id,pct:+x.pct||0}));
      const tot=f.reduce((a,x)=>a+x.pct,0);
      if(f.length) focus[m.ym]=f.map(x=>({id:x.id,pct:Math.round(x.pct/(tot||1)*100)}));
    });
    if(aiAlloc&&(ord.length<allIds.length||Object.keys(focus).length))
      aiInfo={mode:aiAlloc.mode==="sequential"?"sequential":"mixed",order:ord,focus,
        notes:String(aiAlloc.notes||"").slice(0,400)};
  }
  const order=aiInfo
    ? subj.slice().sort((a,b)=>aiInfo.order.indexOf(a.id)-aiInfo.order.indexOf(b.id))
    : [...subj].sort((a,b)=>(b.weight||1)-(a.weight||1));
  const calcPool=subj.filter(x=>x.cat==="calc"), memPool=subj.filter(x=>x.cat==="mem"), mixPool=subj.filter(x=>x.cat==="mix");
  const allocW=alloc(brushW,[...calcPool,...mixPool]);
  const allocE=alloc(brushE,[...memPool,...mixPool]);
  const subjectPlan=subj.map(x=>({id:x.id,title:x.title,cat:x.cat,mode:x.mode,weight:x.weight,
    qTotal:x.qTotal,qDone:x.qDone,qAcc:x.qAcc, dailyW:allocW[x.id]||0, dailyE:allocE[x.id]||0}));
  let phases=[];
  if(days<=0){ phases=[{name:"临考冲刺",days:1,dailyMock:1,dailyWrong:Math.min(remaining,40),focus:"保状态, 清错题"}]; }
  else if(days<=14){ phases=[{name:"冲刺模考",days,dailyMock:2,dailyWrong:Math.min(remaining,30),focus:"全真模考+错题清零"}]; }
  else{
    const base=Math.max(1,Math.round(days*0.5)), enh=Math.max(1,Math.round(days*0.3)), sprint=Math.max(1,days-base-enh);
    phases=[
      {name:"基础夯实",days:base,dailyBrush:brushW,dailyNew:newW,focus:"按类别路由通刷: 工作日主攻理解型, 周末背诵记忆型"},
      {name:"强化提升",days:enh,dailyBrush:Math.round(brushW*1.2),dailyNew:Math.round(newW*0.6),focus:"薄弱章节+错题重点突破"},
      {name:"冲刺模考",days:sprint,dailyMock:1,dailyWrong:Math.min(remaining,20),focus:"全真模考+错题清零+查漏"}
    ];
  }
  const mockDays=phases.reduce((a,p)=>a+(p.dailyMock?p.days:0),0);
  const adj = factor>1.1?"近3天超额完成, 可适当加量或加模考":(factor<0.95?"近3天完成率偏低, 已自适应下调每日额度, 建议固定学习时段(如番茄钟)":"进度节奏良好");
  const weekdayTemplate=[
    {block:"理解型科目刷题",min:Math.round((+s.weekdayMin||90)*0.55),content:"主攻 A 类理解计算科目(高等数学/物理/力学/流体等), 按权重分配每日 "+brushW+" 题"},
    {block:"综合型原理",min:Math.round((+s.weekdayMin||90)*0.2),content:"C 类综合科目原理梳理 + 错题复盘"},
    {block:"新卡 + 错题",min:Math.round((+s.weekdayMin||90)*0.25),content:"新知识点卡 "+newW+" 张 + 复盘前日错题"}
  ];
  const weekendTemplate=[
    {block:"记忆型科目背诵",min:Math.round((+s.weekendMin||240)*0.4),content:"B 类记忆型科目(微生物/监测/评价/法规等)系统背诵, 按权重分配每日 "+brushE+" 题"},
    {block:"综合型刷题",min:Math.round((+s.weekendMin||240)*0.35),content:"C 类综合科目整套题演练"},
    {block:"套卷模考",min:Math.round((+s.weekendMin||240)*0.25),content:"周末时间充裕, 建议安排 1 套全真模考"}
  ];
  // ---- 层级结构: 阶段→月→周(知识点)→天 (月主攻按权重, 周知识点按各科顺序推进, 天额度按工作日/周末/假期) ----
  const startDate=new Date(today()+"T00:00:00");
  const endDate=examDate?new Date(examDate+"T00:00:00"):new Date(startDate.getTime()+90*864e5);
  const pd=phases.map(p=>p.days); const totD=Math.max(1,pd.reduce((a,b)=>a+b,0));
  const dates=[]; for(let d=new Date(startDate); d<=endDate&&dates.length<totD; d=new Date(d.getTime()+864e5)) dates.push(d);
  const kpTitles={}; subj.forEach(x=>{
    const ks=(BANK.knowledgePoints||[]).filter(k=>(k.content||"").trim()&&!/^\d+(\.\d+)*$/.test(String(k.title||"").trim())
      &&(x.chapters||[]).some(c=>k.chapterId===c||k.chapterId.startsWith(c+"-")));
    kpTitles[x.id]=ks.map(k=>String(k.title||"").trim()).filter(Boolean).slice(0,80);
  });
  const curKp={}; subj.forEach(x=>curKp[x.id]=0);
  const months=[]; const byYm={};
  dates.forEach((d,i)=>{
    const ym=fmtD(d).slice(0,7);
    const b0=pd[0]||0, b1=b0+(pd[1]||0);
    const ph=i>=b1?(phases[2]||phases[phases.length-1]).name:(i>=b0?(phases[1]||phases[0]).name:phases[0].name);
    let m=byYm[ym];
    if(!m){ m=byYm[ym]={ym,phase:ph,start:fmtD(d),end:fmtD(d),ds:[],brushGoal:0,subjects:[],weeks:[]}; months.push(m); }
    m.end=fmtD(d); m.phase=ph; m.ds.push(d);
  });
  months.forEach(m=>{
    m.brushGoal=m.ds.reduce((a,d)=>a+dayTargetFor(fmtD(d)).brush,0);
    /* 月主攻: AI 分配了该月占比则按占比(含 pct), 否则按权重前5 */
    m.subjects=(aiInfo&&aiInfo.focus[m.ym])
      ? aiInfo.focus[m.ym].map(f=>{ const x=subj.find(s2=>s2.id===f.id)||{};
          return {id:f.id,title:x.title||f.id,weight:x.weight,cat:x.cat,pct:f.pct}; })
      : order.slice(0,5).map(x=>({id:x.id,title:x.title,weight:x.weight,cat:x.cat}));
    const ws=[]; let seg=[];
    m.ds.forEach(d=>{ if(d.getDay()===1&&seg.length){ ws.push(seg); seg=[]; } seg.push(d); });
    if(seg.length) ws.push(seg);
    m.weeks=ws.map((sg,wi)=>{
      /* 周科目选取: AI 单科推进 → 本月主科(末周带衔接科); AI 混配 → 按月内科目轮转; 默认 → 权重轮转 */
      let picks;
      if(aiInfo&&m.subjects.length){
        if(aiInfo.mode==="sequential"){
          picks=wi>=ws.length-1&&m.subjects.length>1?m.subjects.slice(0,2):m.subjects.slice(0,1);
        } else {
          const n=Math.min(m.subjects.length,3);
          picks=[0,1,2].slice(0,n).map(k=>m.subjects[(wi+k)%m.subjects.length]);
        }
      } else picks=[order[(wi*3)%order.length],order[(wi*3+1)%order.length],order[(wi*3+2)%order.length]].filter(Boolean);
      const items=picks.map(x=>{ const pool=kpTitles[x.id]||[]; const take=[];
        for(let t=0;t<4&&curKp[x.id]<pool.length;t++){ take.push(pool[curKp[x.id]++]); }
        return {id:x.id,title:x.title,cat:x.cat,kps:take}; });
      return {range:fmtD(sg[0])+" ~ "+fmtD(sg[sg.length-1]),start:fmtD(sg[0]),end:fmtD(sg[sg.length-1]),days:sg.length,
        brushGoal:sg.reduce((a,d)=>a+dayTargetFor(fmtD(d)).brush,0),items};
    });
  });
  // ---- P6: 课程排程 —— 各科未看完的视频在"该科出现的周"里顺序推进 ----
  const courseStat=this.scheduleCourses(months);
  months.forEach(m=>delete m.ds);
  ST.plan={engine:aiInfo?"ai-alloc":"deterministic",v:2,
    source:aiInfo?("AI 智能排程 · "+(aiInfo.mode==="sequential"?"单科推进":"科目混配")):"确定性引擎",
    aiMode:aiInfo?aiInfo.mode:undefined,aiNotes:aiInfo?aiInfo.notes:undefined,
    generatedAt:today0,examName:s.examName,examDate,days,total,done,remaining,
    weekdayMin:+s.weekdayMin,weekendMin:+s.weekendMin,weekendFactor:wk,pomo,factor,learnRatio:s.learnRatio||{base:60,mid:40,sprint:15},
    brushW,brushE,newW,newE,catRouting:{calc:"工作日主攻",mem:"周末背诵",mix:"工作日原理+周末综合"},
    phases,subjectPlan,mockDays,weekdayTemplate,weekendTemplate,months,courseStat,adj};
  Store.save("plan"); this.ensureTasks(true); this.renderDet();
  toast("确定性计划已生成 (阶段→月→周→天, 已含跟课排程并写入未来30天每日任务)");
},
/* ---- P6: 把各科未看完的视频排入周计划。可重复调用(增删视频后重排) ---- */
scheduleCourses(months){
  const allWeeks=[];
  (months||[]).forEach(m=>(m.weeks||[]).forEach(w=>{
    (w.items||[]).forEach(i=>{ delete i.lessons; delete i.course; }); allWeeks.push(w); }));
  const subjWeeks={}; allWeeks.forEach(w=>(w.items||[]).forEach(it=>{ (subjWeeks[it.id]=subjWeeks[it.id]||[]).push(w); }));
  const curLes={}, stat={};
  Object.keys(subjWeeks).forEach(sid=>{
    const vs=this.courseOfSubj(sid); curLes[sid]=0; stat[sid]=this.courseStat(sid);
    const ws=subjWeeks[sid]; if(!vs.length||!ws.length) return;
    ws.forEach((w,idx)=>{
      const left=Math.max(0,vs.length-curLes[sid]); if(!left) return;
      const per=Math.max(1,Math.ceil(left/Math.max(1,ws.length-idx)));
      const take=vs.slice(curLes[sid],curLes[sid]+per); curLes[sid]+=take.length;
      const it=w.items.find(i=>i.id===sid);
      if(it&&take.length){ it.lessons=take.map(v=>({vid:v.id,title:v.title,pct:vidPct(v)}));
        it.course={planned:take.length,total:stat[sid].n,done:stat[sid].done}; }
    });
  });
  return stat;
},
/* ---- 计划落位到每日任务: 从今天起写满30天, 已有安排的天不覆盖; 之后每月增量续期 ---- */
ensureTasks(force){
  if(!ST.taskDays) ST.taskDays={};
  const cut=fmtD(new Date(Date.now()-60*864e5));
  Object.keys(ST.taskDays).forEach(dt=>{ if(dt<cut) delete ST.taskDays[dt]; });   // 清理60天前旧任务
  const s=ST.settings;
  let added=0;
  for(let i=0;i<30;i++){
    const dt=fmtD(new Date(Date.now()+i*864e5));
    const old=ST.taskDays[dt];
    if(old&&old.v===2&&!force) continue;
    const w=this.weekOf(dt);
    const wknd=isWeekend(new Date(dt+"T00:00:00"));
    const raw=w?dayTargetFor(dt,1):dayTargetFor(dt);           // 未扣假期的基准 minutes→题量
    const hd=isHoliday(dt);
    let mins=wknd?(+s.weekendMin||240):(+s.weekdayMin||90);
    const items=(w&&w.w.items)||[];
    const lessons=items.flatMap(it=>it.lessons||[]);
    // 本周课程按天均分 -- 未开始的/已开头的优先排前面
    const per=Math.ceil(lessons.length/Math.max(1,w?w.days:1));
    const mine=lessons.slice((w?w.idx:0)*per,(w?w.idx:0)*per+per);
    const ratio=mine.length?this.ratioOf(w?w.m.phase:""):0;
    let brushMin=mins;
    if(mine.length) brushMin=Math.round(mins*(1-ratio)); else if(lessons.length) brushMin=mins;
    if(hd) brushMin=Math.round(brushMin*(hd.intensity||0.4));
    let brush=Math.max(hd?3:5,Math.round(brushMin/2.2));
    if(raw.sprint) brush=0;                                     // 冲刺期: 模考+错题为主
    const chs=[]; items.forEach(it=>{ const sj=this.syllabus().find(x=>x.id===it.id);
      (sj&&sj.chapters||[]).forEach(c=>{ if(!chs.includes(c)) chs.push(c); }); });
    ST.taskDays[dt]={v:2,brush,cards:Math.max(2,Math.round(mins/25)),
      courseMin:mins-brushMin,brushMin,ratio:Math.round(ratio*100),
      lessons:mine, targets:items.map(it=>({id:it.id,title:it.title,cat:it.cat})),
      kps:items.flatMap(it=>it.kps||[]).slice(0,12), chapters:chs,
      phase:(w&&w.m.phase)||"", week:(w&&w.w.range)||""};
    added++;
  }
  if(added) Store.save("taskDays");
},

/* ---- 进度校准(保大调小): 对比月目标 vs 实际, 天级补量; 月目标确实无法达成才提示调整大计划 ---- */
calibrate(){
  const p=ST.plan; if(!p||!Array.isArray(p.months)||!p.months.length) return [];
  const rows=[];
  for(const m of p.months){
    if(m.end<today()){ rows.push({ym:m.ym,goal:m.brushGoal,actual:-1,remainDays:0,perDay:0,base:0,feasible:true,past:true}); continue; }
    const from=m.start<today()?today():m.start;
    let remainDays=0;
    for(let d=new Date(from+"T00:00:00"); d<=new Date(m.end+"T00:00:00"); d=new Date(d.getTime()+864e5)) remainDays++;
    let actual=0;
    if(m.start<=today()) for(let d=new Date(m.start+"T00:00:00"); d<=new Date((m.end<today()?m.end:today())+"T00:00:00"); d=new Date(d.getTime()+864e5)) actual+=((ST.daily[fmtD(d)]||{}).b||0);
    const gap=Math.max(0,m.brushGoal-actual);
    const perDay=remainDays?Math.ceil(gap/remainDays):gap;
    const base=Math.max(5,dayTargetFor(today()).brush);
    rows.push({ym:m.ym,goal:m.brushGoal,actual,remainDays,perDay,base,feasible:perDay<=Math.round(base*1.8),past:false});
  }
  return rows;
},
renderCalib(){
  const box=$("#calib-out"); if(!box) return;
  const rows=this.calibrate();
  if(!rows.length){ box.innerHTML='<div class="muted" style="margin-top:8px">生成计划后这里显示每个月「目标 vs 实际」的差距与补量建议。</div>'; return; }
  box.innerHTML=rows.map(r=>{
    if(r.past) return `<div class="muted" style="margin:4px 0;font-size:12.5px">${r.ym}: 已结束 (目标 ${r.goal} 题)。</div>`;
    const col=r.feasible?"var(--ok)":"var(--bad)";
    const adv=r.perDay<=r.base?`<span style="color:var(--ok)">按当前节奏可达成, 无需调整</span>`
      :r.feasible?`<span style="color:#d68910">需提升到 <b>${r.perDay} 题/天</b>(当前约 ${r.base}) <button class="btn sm" onclick="Plan.applyCalib('${r.ym}',${r.perDay})">一键校准每日任务</button></span>`
      :`<span style="color:var(--bad)">剩余 ${r.remainDays} 天需 ${r.perDay}/天, 超出可承受范围 → 建议调整大计划 <button class="btn sm" onclick="Plan.escalate('${r.ym}')">顺延部分目标到下月</button></span>`;
    return `<div class="row" style="margin:5px 0;gap:8px;flex-wrap:wrap;align-items:center">
      <b style="width:64px">${r.ym}</b><span class="muted" style="font-size:12px;width:150px">月目标 ${r.goal} 题</span>

      <span style="font-size:12.5px;color:${col}">${adv}</span></div>`;
  }).join("")+`<div class="muted" style="margin-top:6px;font-size:11.5px">原则: 先调「天」(校准每日任务, 月目标不动); 只有当剩余天数×最高可承受题量仍追不上月目标时, 才顺延到下月(动「月」需你确认)。</div>`;
},
applyCalib(ym,perDay){
  if(!ST.taskDays) ST.taskDays={};
  const m=(ST.plan&&ST.plan.months||[]).find(x=>x.ym===ym); if(!m) return;
  const from=m.start<today()?today():m.start;
  // 工作日 perDay, 周末 ×1.3, 假期按强度降额; 周末多出的量从工作日预算来, 整体不超 perDay 均摊
  let n=0, cap=perDay*1.6;
  for(let d=new Date(from+"T00:00:00"); d<=new Date(m.end+"T00:00:00"); d=new Date(d.getTime()+864e5)){
    const dt=fmtD(d); const t=dayTargetFor(dt);
    let v=t.brush?Math.max(3,Math.min(cap,Math.round(perDay*(t.wknd?1.3:1)*(t.holiday?(t.holiday.intensity||0.4):1)))):t.brush;
    ST.taskDays[dt]={brush:v,cards:Math.max(2,Math.round((+ST.settings.weekdayMin||90)/6))}; n++;
  }
  Store.save("taskDays"); renderPlanMini($("#plan-today"));
  toast("已校准 "+ym+": 剩余每日任务按 "+perDay+" 题/天 重排(已开工的天不回退)");
},
escalate(ym){
  const p=ST.plan; const i=(p.months||[]).findIndex(x=>x.ym===ym); if(i<0) return;
  const m=p.months[i]; const nxt=p.months[i+1];
  const rows=this.calibrate(); const r=rows.find(x=>x.ym===ym);
  const defer=r?Math.round(r.perDay*Math.max(0,r.remainDays)*0.25):0;   // 顺延 25% 缺口
  if(!nxt){ toast("已是最后一个月, 无法顺延; 建议压缩科目范围(③ 中放弃低优先科目)后重新生成计划"); return; }
  if(!confirm(`确认把 ${ym} 的约 ${defer} 题目标顺延到 ${nxt.ym}?\n(月度目标会下调, 下月目标相应上调)`)) return;
  m.brushGoal=Math.max(0,m.brushGoal-defer); nxt.brushGoal+=defer;
  // 同步下调本月剩余每日任务到可承受范围
  this.applyCalib(ym,Math.max(5,this.calibrate().find(x=>x.ym===ym).base));
  this.renderHiera(); this.renderCalib(); Store.save("plan");
  toast(`已顺延: ${ym} 目标下调 ${defer} 题 → ${nxt.ym}`);
},

mdMini(src){
  const inline=t=>esc(t).replace(/`([^`]+)`/g,"<code style='background:var(--pri-weak);padding:0 4px;border-radius:3px'>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  const lines=String(src||"").replace(/\r/g,"").split("\n");
  let h="",list=null,table=null;
  const closeList=()=>{ if(list){h+="</"+list+">";list=null;} };
  const closeTable=()=>{
    if(!table) return;
    const rows=table.filter(r=>!r.every(c=>/^:?-+:?$/.test(c)));
    if(rows.length){
      h+="<div style='overflow-x:auto;margin:8px 0'><table style='width:100%;border-collapse:collapse;font-size:12.5px'>";
      rows.forEach((r,ri)=>{ const tag=ri===0?"th":"td";
        h+="<tr>"+r.map(c=>"<"+tag+" style='border:1px solid var(--line);padding:4px 8px;text-align:left'>"+inline(c)+"</"+tag+">").join("")+"</tr>"; });
      h+="</table></div>";
    }
    table=null;
  };
  const closeAll=()=>{ closeList(); closeTable(); };
  for(const l of lines){
    const t=l.trim(); let m;
    if(/^\|.*\|$/.test(t)){ closeList(); (table=table||[]).push(t.replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); continue; }
    closeTable();
    if(!t){ closeList(); continue; }
    if(m=t.match(/^(#{1,4})\s+(.+)$/)){ closeList(); const lv=m[1].length+1; h+="<h"+lv+" style='margin:"+(lv<=2?"14px 0 6px":"10px 0 4px")+";font-size:"+(19-lv*1.5)+"px'>"+inline(m[2])+"</h"+lv+">"; continue; }
    if(/^([-*_] ?){3,}$/.test(t)){ closeList(); h+="<hr style='border:none;border-top:1px solid var(--line);margin:10px 0'>"; continue; }
    if(m=t.match(/^[-*]\s+(.+)$/)){ if(list!=="ul"){ closeList(); h+="<ul style='margin:4px 0 4px 20px;padding:0'>"; list="ul"; } h+="<li style='margin:3px 0'>"+inline(m[1])+"</li>"; continue; }
    if(m=t.match(/^\d+[.、)]\s+(.+)$/)){ if(list!=="ol"){ closeList(); h+="<ol style='margin:4px 0 4px 20px;padding:0'>"; list="ol"; } h+="<li style='margin:3px 0'>"+inline(m[1])+"</li>"; continue; }
    closeList(); h+="<p style='margin:6px 0'>"+inline(t)+"</p>";
  }
  closeAll();
  return h;
},
